# The Python tools `ci / tools` runs (zizmor, ruff, mypy), pinned exactly, and
# their dependencies, locked with hashes in uv.lock beside this file.
# tests/lib/lint-tools.sh installs them hash-checked from that lock. Dependabot
# (uv) raises a pin and its lock in one pull request (#1220); by hand, edit
# the pin here, then `uv lock --project tools/lint`. zizmor from 1.31 needs
# Python 3.11.
[project]
name = "plinth-lint-tools"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "zizmor==1.33.1",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[tool.uv]
package = false
