[project]
name = "probe"
version = "0.1.0"
description = "One line saying what this is"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "coolbress" }]
# The package ships `py.typed`: a type checker reads its annotations.
classifiers = ["Typing :: Typed"]
dependencies = []

# The command `pip install` or `uv tool install` puts on PATH. It runs what
# `python -m probe` runs, and has the distribution's name, which
# `uvx probe` and `pipx run` look for.
[project.scripts]
probe = "probe.__main__:main"

# Distribution metadata. Read by `pip show`, GitHub and the dependency graph
# even when the package is never uploaded.
[project.urls]
Homepage = "https://github.com/coolbress/probe"
Issues = "https://github.com/coolbress/probe/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

# Linter and formatter. The configuration is committed; CI runs `ruff check`
# and `ruff format --check` as `ci / lint`.
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "PT", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is the normal form in tests
"tests/**" = ["S101"]

# Type checking, `ci / typecheck`.
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

# Tests, `ci / test`.
[tool.pytest.ini_options]
testpaths = ["tests"]
# No silent failures: an unregistered `@pytest.mark.foo` is a no-op even when
# it is a typo, and a misspelt key in this section is ignored. Both are made
# errors.
addopts = ["--strict-markers", "--strict-config"]
# A test marked `xfail` that passes is a failure too, so the mark is removed
# when the bug it waited on is fixed.
xfail_strict = true
# Warnings are errors. A third-party warning that blocks gets one narrow
# ignore here, with its reason.
filterwarnings = ["error"]
