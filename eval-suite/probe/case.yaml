# The #665 probe case, run by scripts/eval-suite-probe.sh in a copy of plinth
# as committed, never from here: does `claude plugin eval` load plinth with its
# dependencies, the workspace's AGENTS.md and .claude/, and run git and uv?
schema_version: "1.1"
name: probe
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: []
  prompt: |
    This is a harness probe, not a task. Do not read or search any file.
    1. If the project instructions loaded into your context have a line that starts with "Probe marker:", quote that line exactly. If not, write MARKER: NONE.
    2. Run exactly this one shell command, and nothing else: bash probe-checks.sh
    Then stop.
graders:
  - name: ran
    type: regex
    pattern: "."
