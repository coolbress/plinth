# Labels this repository's pull requests by type. The logic is in the reusable
# pr-label.yml, not here.
#
# The job is deliberately not named `ci`: this is not a check and is not in
# any ruleset, so it must not report under a `ci / *` name.
name: PR label

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write   # only to add the label

jobs:
  label:
    uses: ./.github/workflows/pr-label.yml
