# Asks a failed `third-party / review` again once the reviewer has answered
# (#363). The check waits `wait-seconds` for the reviewer's signal and fails.
# A review with findings is a `pull_request_review` event, which third-party.yml
# listens to, so that case recovers by itself. A zero-finding verdict is an
# issue comment and a `+1` reaction on the pull request (#359, #362), and
# neither starts that workflow: the check stayed red until a person re-ran it.
#
# Two triggers ask. The reviewer's comment, at once: any comment in the
# repository starts this, and the step ends with no API call unless an accepted
# reviewer wrote it on a pull request; then that pull request alone is read.
# The schedule, every 15 minutes, reads every open pull request: a safety net,
# and late here (the nightly e2e, due 03:17 UTC, started 5 h 19 min to 6 h 33
# min late from 2026-09-26 to 2026-09-30; #363), so it is not the main path.
#
# For each pull request it reads the newest run of third-party.yml on the head.
# When that run failed and an accepted reviewer has left a review, a review
# comment or an issue comment since it ended, it re-runs the failed job. A
# reaction alone does not: the check does not count it (it names no commit),
# so that re-run would only fail again. The re-run decides, with the check's
# own binding rules (scripts/pr-review/attest.py); this only asks again. The
# decision is scripts/review-rerun.py: once per new signal, never past the
# third attempt. A reviewer that never starts ends as before: a failed check
# and a person's decision. The step is scripts/review-rerun.sh.
#
# The pull request's code is never checked out or run: on `issue_comment` and
# `schedule` GitHub runs this file from the default branch and the checkout is
# of that branch; the pull request is read through the API only. A comment's
# body is not read at all, and its author reaches the step through `env:`.
#
# plinth's own workflow; whether consumers get it is decided after it has run
# here (#363). It makes no check on a pull request.
name: review-rerun

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

# One run at a time per pull request for comments, one for the schedule. A
# pending run in a group is replaced by a newer one, so comments on different
# pull requests must not share a group. When a comment's run and the schedule
# decide on the same failed run, the second re-run is refused and the step
# reads that as already running, not as an error.
concurrency:
  group: review-rerun-${{ github.event.issue.number || 'all' }}
  cancel-in-progress: false

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read         # the checkout of the default branch, for the scripts
      pull-requests: read    # pull requests, their reviews, comments and reactions
      actions: write         # re-running a failed job; this job's token only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Re-run a failed third-party / review the reviewer has answered since
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # third-party.yml passes no `reviewer-logins`, so pr-review.yml's
          # default applies; keep the two the same.
          LOGINS: "chatgpt-codex-connector[bot]"
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request.url }}     # empty on an issue
          COMMENTER: ${{ github.event.comment.user.login }}
        run: bash scripts/review-rerun.sh
