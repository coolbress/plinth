name: CI
#
# The caller job is named `ci` on purpose: the checks report as `ci / install`
# and `ci / tools`, and rulesets require those names. Rename it and the
# required checks never report again. ci-text.yml's `ci` job reports
# `ci / docs` and `ci / release-gate` the same way.

on:
  push:
    branches: [main]
  # Not on `edited`: an edit to the title or the description re-runs only
  # the checks that read them, in ci-text.yml (`ci / docs`, `ci / release-gate`
  # and the canaries' `pr-title` and `diff-size`), and starts nothing here, so
  # it neither re-runs `ci / install`, `ci / tools` or a canary's code jobs nor
  # cancels this workflow's run (#1133, after #322).
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # A called workflow cannot widen what its caller grants. `ci / install`
    # reads which step of its install-<n> jobs failed (#1135); plinth-ci.yml's
    # other jobs keep `contents: read` alone. `ci / docs` and
    # `ci / release-gate` are in ci-text.yml (#1133).
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/plinth-ci.yml

  # The canary calls the reusable workflow for real: a workflow that parses is
  # not a workflow that runs. Consumers break here first. Inputs are passed on
  # purpose; an input nobody passes is a code path nobody runs.
  canary:
    uses: ./.github/workflows/python-ci.yml
    # A called workflow cannot widen what its caller grants: a job there that
    # asks for more than this grant fails the whole run at startup, no check
    # reporting (measured for #586). python-ci.yml's floor-check asks for
    # `issues: read` (labels) and diff-size for `pull-requests: read` and
    # `actions: write` (the approval of a change to the checks). Scoped to
    # this job, not raised for the whole file.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: write
    with:
      working-directory: canary
      extra-python-versions: "3.13"
      floor-check-required-checks: "ci / install, ci / tools, ci / docs, ci / release-gate"   # CodeQL is a code_scanning rule; floor-check sees it either way

  # The same call on the `web` archetype as plinth-template renders it, a
  # Django project (#614): the checks every archetype runs, on a project whose
  # mypy loads Django's settings and whose pytest runs pytest-django, and with
  # `web: true` the two web-only jobs and the tests' Postgres. Its check names
  # are `canary-web / …`, required by no ruleset.
  canary-web:
    uses: ./.github/workflows/python-ci.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: write
    with:
      working-directory: canary-web
      web: true
      floor-check-required-checks: "ci / install, ci / tools, ci / docs, ci / release-gate"

  # plinth-template's `cli` project as the door renders it today, at the
  # commit scripts/new-project.sh pins, committed under canary-template/,
  # through this commit's python-ci.yml (#953). The grant and the inputs are
  # the rendered caller's `ci` job, copied: a python-ci.yml change that the
  # template's caller cannot run fails here, in plinth's pull request, not in
  # a project after the release. tests/template-render.sh fails when the
  # copy, the render or this name falls behind the pin; a pin raise re-renders
  # with `tests/template-render.sh --write`. Added to the copy, and only these:
  # the directory, plinth's own ruleset's checks (as `canary` passes them),
  # and no diff limit, since the render is generated, not reviewed line by
  # line. Its check names are `canary-template (…) / …`, required by no
  # ruleset; the name moves with the pin.
  canary-template:
    name: canary-template (plinth-template v1.53.0 at 6a0c42a)
    uses: ./.github/workflows/python-ci.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: write
    with:
      working-directory: canary-template
      extra-python-versions: "3.14"
      max-diff-lines: 0
      floor-check-required-checks: "ci / install, ci / tools, ci / docs, ci / release-gate"
