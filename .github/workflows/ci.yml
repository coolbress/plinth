name: CI
#
# The caller job is named `ci` on purpose: the checks report as `ci / install`
# and `ci / docs`, and rulesets require those names. Rename it and the required
# checks never report again.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/plinth-ci.yml
