name: CI
#
# The caller job is named `ci` on purpose: the checks report as `ci / install`,
# `ci / tools` and `ci / docs`, and rulesets require those names. Rename it and
# the required checks never report again.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/plinth-ci.yml

  # The canary calls the reusable workflow for real: a workflow that parses is
  # not a workflow that runs. Consumers break here first. Inputs are passed on
  # purpose; an input nobody passes is a code path nobody runs.
  canary:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: canary
      extra-python-versions: "3.13"
      floor-check-required-checks: "ci / install, ci / tools, ci / docs"   # CodeQL is a code_scanning rule; floor-check sees it either way
