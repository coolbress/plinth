name: CI
# Probe for #1133, on a test pull request that is closed unmerged. Plain jobs
# report the five names plinth's ruleset requires. `ci / docs` reads the
# description from the event payload, waits DOCS_WAIT seconds, and fails when
# the description it read holds PROBE-FAIL.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: probe-push-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install:
    name: ci / install
    runs-on: ubuntu-latest
    steps:
      - run: sleep 20
  tools:
    name: ci / tools
    runs-on: ubuntu-latest
    steps:
      - run: "true"
  release-gate:
    name: ci / release-gate
    runs-on: ubuntu-latest
    steps:
      - run: "true"
  review:
    name: third-party / review
    runs-on: ubuntu-latest
    steps:
      - run: "true"
  docs:
    name: ci / docs
    runs-on: ubuntu-latest
    steps:
      - env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf 'push run read: %s\n' "$BODY"
          sleep 150
          case "$BODY" in *PROBE-FAIL*) echo "::error::PROBE-FAIL in the description read at the push"; exit 1 ;; esac
