name: plinth-ci
# plinth's own checks. Called from ci.yml so the names come out as `ci / <job>`.
# No job is skipped with `if:`; a skipped job has no check name.
#
# A release download sends the job's token, as python-ci.yml's do (#878);
# tests/release-download-token.sh holds the form.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Tier 1, the installer's journey: what the README says, typed on a clean runner.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Claude Code (stable channel, official installer)
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Manifests, pins, skill frontmatter
        run: ./tests/marketplace-manifest.sh

      - name: Every test file is wired
        run: ./tests/all-tests-are-wired.sh

      - name: The wall the door applies is a wall
        run: ./scripts/check-ruleset.sh

      - name: python-ci contract (job names, inputs, secrets, ruleset contexts)
        run: ./tests/python-ci-contract.sh

      - name: GitLab pipeline matches python-ci; four of its jobs run on fixtures
        run: ./tests/gitlab-ci-cases.sh

      - name: ci / pr-title verdicts
        run: ./tests/pr-title-cases.sh

      - name: ci / pr-title fails a description that would close an issue outside its closing line
        run: ./tests/pr-title-description-cases.sh

      - name: A red or warning check's annotations say what failed, one next action and a link that exists
        run: ./tests/check-messages.sh

      - name: ci / diff-size names changes to the checks the description does not
        run: ./tests/weakened-checks-cases.sh

      - name: ci / diff-size asks an admin to approve a change to the checks
        run: ./tests/checks-approval-cases.sh

      - name: Every if-gated workflow input is passed by a caller
        run: ./tests/inputs-are-exercised.sh

      - name: Archetype vocabulary has one source
        run: ./tests/archetype-single-source.sh

      - name: plinth's own rules carry each rule shared with the pinned template
        run: ./tests/template-rules-drift.sh

      - name: The arsenal says what the pinned template and the plugin ship
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/arsenal-freshness.sh

      - name: The label list has one source, read by the door and the checker
        run: ./tests/labels-single-source.sh

      - name: Floor checker verdicts on fixtures
        run: ./tests/floor-check-cases.sh

      - name: The guide's next step per state, and only the arsenal's tools
        run: ./tests/guide-cases.sh

      - name: The term table has every first-project term, and the guide points at it
        run: ./tests/term-table.sh

      - name: The off-by-default list has one source, read by the door and the guide
        run: ./tests/off-by-default-cases.sh

      - name: The guidance names only skills the default install carries
        run: ./tests/guidance-skills.sh

      # uv for the web checks' fixture projects, the release python-ci.yml pins.
      - name: Install uv (official release, SHA256 verified)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UV_VERSION: "0.13.7"
          UV_SHA256: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/uv"; mkdir -p "$d"
          f="uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 ${GITHUB_TOKEN:+-H "Authorization: Bearer $GITHUB_TOKEN"} -o "$d/$f" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/$f"
          echo "${UV_SHA256}  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" --strip-components=1 "${f%.tar.gz}/uv" "${f%.tar.gz}/uvx"
          echo "$d" >> "$GITHUB_PATH"

      - name: ci / migrations and ci / deploy-check fail and pass where they must, on Postgres
        run: ./tests/web-checks-cases.sh

      - name: The door's Actions allowlist and SECURITY.md route agree with the template it renders
        run: ./tests/release-allowlist.sh

      - name: plinth's reusable workflows use only actions every consumer's Actions allowlist allows
        run: ./tests/reusable-workflow-allowlist.sh

      # The workflow's own Node and Chrome steps, then a real audit of a page
      # with known violations.
      - name: ci / web-audit names a known violation, says what automated checks miss, and never fails
        run: ./tests/web-audit-cases.sh

      - name: Every uv pin is one release and its checksum, the template's too
        run: ./tests/uv-pin.sh

      # The token is the job's, so the log's `curl -v` lines show it masked.
      - name: Every github.com release download sends the token, to github.com only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tests/release-download-token.sh

      - name: A uv pin behind upstream opens one issue, and closes it with an ending once raised
        run: ./tests/uv-pin-reminder-cases.sh

      # A stubbed `claude`: no model is called and no login is needed.
      - name: The eval suite refuses your own config, keeps GitHub out, stops at its ceiling, and its grader fails what it must
        run: ./tests/eval-suite-cases.sh

      - name: The plugin eval probe tells held from gone from unclear, and deletes what plugin eval keeps
        run: ./tests/eval-suite-probe-cases.sh

      # zsh is not assumed on the runner image; without it the next test fails, it does not skip.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: The floor-check skill's command passes the same arguments under bash and zsh
        run: ./tests/floor-check-run-block.sh

      - name: The door creates nothing before preflight passes and deletes on any failure after
        run: ./tests/new-project-failpath.sh

      - name: The door's shared .github decisions on fixtures, without the door
        run: ./tests/shared-github-cases.sh

      - name: The template update runs the checker's command in a worktree and opens nothing over a conflict
        run: ./tests/template-update-cases.sh

      - name: The admin token is read from the terminal, not from a pasted stdin
        run: ./tests/token-prompt-not-from-stdin.sh

      - name: Install plinth the way the README says
        run: ./tests/install-smoke.sh

      # Last in the job: from here on `claude` is the floor, not stable.
      - name: Install plinth the way the README says, on the Claude Code floor
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          set -euo pipefail
          floor="$(sed -nE 's/^claude_floor="([^"]+)"$/\1/p' scripts/new-project.sh)"
          curl -fsSL https://claude.ai/install.sh | bash -s "$floor"
          v="$(claude --version | awk '{print $1}')"
          [ "$v" = "$floor" ] || { echo "::error::expected claude $floor, got $v"; exit 1; }
          ./tests/install-smoke.sh

  # Tools: everything in this repository that is not prose is executable, and
  # most of it runs in other people's repositories (the reusable workflows, the
  # ruleset tools, the door). Lint it as such, then run the tests of the tools.
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The commands, their flags and the reason for each live in the lint
      # files, so a local run is the same call. A failed step skips the ones
      # after it, so after checkout the steps that need nothing from the
      # network run first, and the ones that download (actionlint's binary,
      # then zizmor, ruff and mypy from a hash-checked venv) run last.
      - name: Shell syntax and static analysis (bash -n, shellcheck)
        run: ./tests/shell-lint.sh

      - name: The two lint files fail on a missing tool or a version that is not the pin
        run: ./tests/lint-wrappers-cases.sh

      - name: Ruleset upgrade refuses names that never reported
        run: ./tests/upgrade-ruleset-guard.sh

      - name: Adding a rule kind only adds
        run: ./tests/add-ruleset-rule.sh

      - name: Requiring one check refuses an unseen name, a job with a condition and a login without administration
        run: ./tests/require-check-cases.sh

      - name: Tag ruleset blocks deletion and moving, never creation
        run: ./tests/tag-ruleset.sh

      - name: Merge ruleset is exactly update bypassed by the admin, written once and read back
        run: ./tests/merge-ruleset.sh

      - name: Security settings are read back after the write
        run: ./tests/security-setting.sh

      - name: ci / deps says not checked only where GitHub refuses dependency review on a private repository
        run: ./tests/deps-served-cases.sh

      - name: Third-party review check blocks on presence, never on the verdict
        run: ./tests/pr-review-attest.sh

      - name: Third-party review check passes drafts, bots and releases without summoning, and nothing else
        run: ./tests/pr-review-gate.sh

      - name: pr-review posts the summons only as the owner, with a token, and only when no accepted reviewer has been active
        run: ./tests/pr-review-summon.sh

      - name: pr-review tells a reviewer that acknowledged and never finished from one that never came, and fails both
        run: ./tests/pr-review-stalled.sh

      - name: The reviewer's instructions cannot be softened inside a reviewed pull request
        run: ./tests/pr-review-policy-pin.sh

      - name: A failed review check is asked again once per new reviewer signal, three attempts at most
        run: ./tests/pr-review-rerun.sh

      - name: The re-run step does nothing on a comment unless the reviewer wrote it on a pull request
        run: ./tests/review-rerun-step.sh

      - name: A description that would close an issue outside its closing line fails, and so does one that cannot be read
        run: ./tests/closing-references-cases.sh

      - name: No release without a why, the tested template tag, and a green e2e run on the tagged commit or its tree
        run: ./tests/make-release-guards.sh

      - name: No merge while a check is red, the reviewer has not answered the head, or an inline comment has no reply
        run: ./tests/merge-when-green-cases.sh

      - name: The e2e driver deletes what it made on every failure, and names what it could not
        run: ./tests/e2e-driver.sh

      - name: The upgrade e2e passes only when the tested pin landed, and deletes what it made on every failure
        run: ./tests/e2e-upgrade-driver.sh

      - name: An interrupted install smoke leaves nothing writing into the dir it removes, and Ctrl-C stops it
        run: ./tests/install-smoke-interrupt.sh

      - name: A pull request that changes a released CHANGELOG.md section fails, unless it names it or puts it back
        run: ./tests/changelog-released-cases.sh

      - name: ci / release-gate passes what is not a release, and a release only on a green e2e on its head
        run: ./tests/release-gate-cases.sh

      - name: plinth's own ruleset, read back, requires its five checks, enforced, with no bypass
        run: ./tests/check-ruleset-own.sh

      # Official release binary, checksum verified: rhysd/actionlint has no
      # action of its own, and a third-party wrapper would need allowlisting.
      # The version and the checksum are read from tests/workflow-lint.sh, the
      # one pin; that script fails here when another version ends up on PATH.
      - name: Install actionlint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="$(sed -n 's/^actionlint_version="\(.*\)"$/\1/p' tests/workflow-lint.sh)"
          sum="$(sed -n 's/^actionlint_sha256="\(.*\)"$/\1/p' tests/workflow-lint.sh)"
          if [ -z "$v" ] || [ -z "$sum" ]; then echo "actionlint pin not found in tests/workflow-lint.sh"; exit 1; fi
          d="$RUNNER_TEMP/actionlint"; mkdir -p "$d"
          f="actionlint_${v}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 ${GITHUB_TOKEN:+-H "Authorization: Bearer $GITHUB_TOKEN"} -o "$d/$f" \
            "https://github.com/rhysd/actionlint/releases/download/v${v}/$f"
          echo "${sum}  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" actionlint
          echo "$d" >> "$GITHUB_PATH"

      - name: Workflow syntax, usage and security (actionlint, zizmor)
        run: ./tests/workflow-lint.sh

      - name: plinth's own Python, linted and type-checked (ruff, mypy)
        run: ./tests/python-lint.sh

      - name: ci / code-growth warns above the conventions, passes below them, and never fails
        run: ./tests/code-growth-cases.sh

  # A release pull request merges only after a green `e2e` on its head (#863).
  # The ruleset requires this check, so the merge button and a bare
  # `gh pr merge` are held too, not only scripts/merge-when-green.sh (#855).
  # A ruleset cannot require a check of release pull requests alone, so it
  # runs on every pull request and every push, and decides in the script:
  # anything that is not a release passes at once. plinth's own: it is not in
  # python-ci.yml, so no consumer sees it. merge-when-green.sh re-runs it once
  # the e2e run is green.
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # the e2e runs on the head
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base: the diff that
          # says whether a manifest's "version" line changes.
          fetch-depth: 2

      - name: A release pull request has a green e2e run on its head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/release-gate.sh

  # Docs gate: public text stays lint-clean, links resolve, no internal vocabulary,
  # the README install block is the one the tutorial shows, and the pull
  # request's own description closes no issue outside its closing line.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # the description and the issues its merge will close (#293)
      issues: read          # those issues' numbers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its parents: HEAD^1 is the base that the
          # released-section step compares CHANGELOG.md with.
          fetch-depth: 2

      # First, so a description that would close the wrong issue is red
      # before the link check's download. A keyword in a sentence closes an
      # issue as `Closes #N` does: "the two fixes #65 decided" closed #65 on
      # merge (#284). Not a pull request: a pass, reported by the script.
      - name: The description closes no issue outside its closing line
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: ./scripts/closing-references.sh

      # A pull request open across a release can merge main in and keep its
      # new line inside the section the release just tagged (#877, #881). The
      # tags are fetched here; reading none fails the script rather than
      # finding every section unreleased. Not a pull request: a pass, reported
      # by the script.
      - name: The pull request changes no released section of CHANGELOG.md
        env:
          EVENT: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          fi
          ./scripts/changelog-released.py

      # The version is pinned in the test, so a local run lints with what runs here.
      - name: markdownlint
        run: ./tests/markdownlint.sh

      # Official release binary, checksum verified: no third-party action to allowlist.
      # Bump the version and the checksum together (checksum: the release's .sha256 asset).
      # Since 0.24 the tarball nests the binary under a directory named like the archive.
      - name: Link check (lychee)
        env:
          LYCHEE_VERSION: "0.24.2"
          LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/lychee"; mkdir -p "$d"
          f="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 ${GITHUB_TOKEN:+-H "Authorization: Bearer $GITHUB_TOKEN"} -o "$d/$f" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$f"
          echo "${LYCHEE_SHA256}  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" --strip-components=1 "${f%.tar.gz}/lychee"
          # The version plugin.json names has no Release until run 2 of
          # scripts/make-release.sh, after its pull request merges; until then
          # its CHANGELOG.md link and the [Unreleased] compare link from its tag
          # answer 404. Those two are skipped, and stay skipped until the next
          # release moves the version on; every earlier version's are checked.
          v="$(jq -er .version .claude-plugin/plugin.json)"; v="${v//./[.]}"
          repo='https://github[.]com/coolbress/plinth'
          # A link to this repository's own blob page on main is checked
          # against the checkout, which is what main holds once this merges,
          # without a request to github.com, whose blob pages answered 503 for
          # over an hour on 2026-10-10 while nothing the pull request changed
          # was at fault (#486). Only main: a link at another ref names a tree
          # the checkout is not, so it still goes to github.com. The link text
          # stays absolute, since a CHANGELOG section becomes a Release body.
          remap=(--remap "^$repo/blob/main/([^#]*)(#.*)?\$ file://$PWD/\$1")
          # A host that refuses every automated request is in .lycheeignore,
          # which lychee reads from the checkout root, with the date measured.
          "$d/lychee" --no-progress --github-token "$GITHUB_TOKEN" "${remap[@]}" \
            --exclude "^$repo/releases/tag/v$v\$" --exclude "^$repo/compare/v${v}[.][.][.]HEAD\$" -- './**/*.md'
          # The remap on two fixtures, offline: an existing file passes with no
          # network, and a missing one fails, so the remap cannot pass unchecked.
          fx="$RUNNER_TEMP/lychee-remap"; mkdir -p "$fx/ok" "$fx/missing"
          echo "[ok](https://github.com/coolbress/plinth/blob/main/README.md#plinth)" >"$fx/ok/a.md"
          echo "[missing](https://github.com/coolbress/plinth/blob/main/no-such-file.md)" >"$fx/missing/a.md"
          "$d/lychee" --no-progress --offline "${remap[@]}" -- "$fx/ok/a.md" \
            || { echo "::error::a remapped link to an existing file failed"; exit 1; }
          if "$d/lychee" --no-progress --offline "${remap[@]}" -- "$fx/missing/a.md"; then
            echo "::error::a remapped link to a missing file passed: the remap checks nothing"; exit 1
          fi

      - name: No internal vocabulary in public text
        run: ./tests/de-jargon.sh

      - name: README install block equals the tutorial's
        run: ./tests/readme-install-block.sh

      - name: The required-checks page names exactly the checks the wall requires
        run: ./tests/required-checks-doc.sh

      - name: The docs' template tag and check counts match the source
        run: ./tests/doc-pinned-facts.sh
