name: plinth-ci
# plinth's own checks. Called from ci.yml so the names come out as `ci / <job>`.
# No job is skipped with `if:`; a skipped job has no check name.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Tier 1, the installer's journey: what the README says, typed on a clean runner.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Claude Code (stable channel, official installer)
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Manifests, pins, skill frontmatter
        run: ./tests/marketplace-manifest.sh

      - name: Every test file is wired
        run: ./tests/all-tests-are-wired.sh

      - name: The wall the door applies is a wall
        run: ./scripts/check-ruleset.sh

      - name: python-ci contract (job names, inputs, secrets, ruleset contexts)
        run: ./tests/python-ci-contract.sh

      - name: ci / pr-title verdicts
        run: ./tests/pr-title-cases.sh

      - name: Every if-gated workflow input is passed by a caller
        run: ./tests/inputs-are-exercised.sh

      - name: Archetype vocabulary has one source
        run: ./tests/archetype-single-source.sh

      - name: Floor checker verdicts on fixtures
        run: ./tests/floor-check-cases.sh

      - name: The door creates nothing before preflight passes and deletes on any failure after
        run: ./tests/new-project-failpath.sh

      - name: The admin token is read from the terminal, not from a pasted stdin
        run: ./tests/token-prompt-not-from-stdin.sh

      - name: Install plinth the way the README says
        run: ./tests/install-smoke.sh

  # Tools: everything in this repository that is not prose is executable, and
  # most of it runs in other people's repositories (the reusable workflows, the
  # ruleset tools, the door). Lint it as such, then run the tests of the tools.
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Official release binary, checksum verified: rhysd/actionlint has no
      # action of its own, and a third-party wrapper would need allowlisting.
      # Bump the version and the checksum together (the release's checksums.txt).
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/actionlint"; mkdir -p "$d"
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$d/$f" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "${ACTIONLINT_SHA256}  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" actionlint
          echo "$d" >> "$GITHUB_PATH"

      # actionlint also runs shellcheck over every `run:` block. `job.workflow_sha`
      # is real (python-ci.yml fetches the checker with it, measured) but not in
      # actionlint's schema yet; that one message is ignored.
      - name: Workflow syntax and usage (actionlint)
        run: actionlint -color -ignore 'property "workflow_sha" is not defined'

      # One file per call: `bash -n a.sh b.sh` parses a.sh only, b.sh is $1.
      - name: Shell syntax (bash -n)
        run: for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done

      - name: Shell static analysis (shellcheck)
        run: shellcheck -S warning scripts/*.sh tests/*.sh

      # Security audit of the workflows, every severity: these files run in
      # consumers' repositories, the widest blast radius here. Not an action
      # (allowlist discipline); pipx is on the runner. 1.30.0 adds a low
      # finding that asks for the `$/` self-repository syntax, which actionlint
      # 1.7.12 does not know yet; raise both together.
      - name: Workflow security (zizmor)
        run: pipx run zizmor==1.29.0 --no-progress .github/workflows/

      - name: Ruleset upgrade refuses names that never reported
        run: ./tests/upgrade-ruleset-guard.sh

      - name: Adding a rule kind only adds
        run: ./tests/add-ruleset-rule.sh

      - name: Tag ruleset blocks deletion and moving, never creation
        run: ./tests/tag-ruleset.sh

      - name: Security settings are read back after the write
        run: ./tests/security-setting.sh

      - name: Third-party review check blocks on presence, never on the verdict
        run: ./tests/pr-review-attest.sh

      - name: The reviewer's instructions cannot be softened inside a reviewed pull request
        run: ./tests/pr-review-policy-pin.sh

  # Docs gate: public text stays lint-clean, links resolve, no internal vocabulary,
  # and the README install block is the one the tutorial shows.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

      # Official release binary, checksum verified: no third-party action to allowlist.
      # Bump the version and the checksum together (checksum: the release's .sha256 asset).
      # Since 0.24 the tarball nests the binary under a directory named like the archive.
      - name: Link check (lychee)
        env:
          LYCHEE_VERSION: "0.24.2"
          LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/lychee"; mkdir -p "$d"
          f="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$d/$f" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$f"
          echo "${LYCHEE_SHA256}  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" --strip-components=1 "${f%.tar.gz}/lychee"
          "$d/lychee" --no-progress --github-token "$GITHUB_TOKEN" -- './**/*.md'

      - name: No internal vocabulary in public text
        run: ./tests/de-jargon.sh

      - name: README install block equals the tutorial's
        run: ./tests/readme-install-block.sh
