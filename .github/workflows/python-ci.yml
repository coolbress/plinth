name: python-ci
#
# Reusable workflow. A consumer repository calls it like this:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, edited]
#     pull_request_review:
#       types: [submitted, dismissed]
#   concurrency:   # keyed on the event: a review's run must not cancel a push's
#     group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
#     cancel-in-progress: ${{ github.event_name == 'pull_request' }}
#   jobs:
#     ci:
#       permissions:
#         contents: read
#         issues: read          # floor-check's labels
#         pull-requests: read   # diff-size reads the reviews
#         actions: write        # diff-size's approval re-runs the red run
#       uses: coolbress/plinth/.github/workflows/python-ci.yml@<commit-sha>
#
# Each permission is one a job here asks for: a `ci` job that does not grant
# it fails at startup, every check with it (#586). The review event is what
# lets an approval turn diff-size green without a push.
#
# Why separate jobs: the floor requires lint, typecheck, test and build as
# separate required checks. Four steps in one job stop at the first failure,
# hide the other three, and cannot be required individually by a ruleset.
#
# Actions are pinned to commit SHAs; tags move and are a supply-chain vector.
# The version in the inline comment is the tag the pinned SHA pointed at.
# Only GitHub-owned actions are used (actions/checkout, actions/dependency-
# review-action); uv and gitleaks come from their official releases with
# checksums, so a repository that restricts actions needs exactly one
# allowlist entry, `coolbress/plinth/*`, for this call itself. Without it the
# run dies at startup and no check name ever reports.
#
# A job that runs to its checking step writes one verdict line per standard
# it covers in its summary: `pass:`, `fail:` or `not yet confirmed:`, the
# last also a `::warning::` (#405, #437; the forms are in
# docs/reference/required-checks.md), except floor-check's reads left to
# /plinth:floor-check, which no Actions token makes. The `say` helper writes
# at most nine annotations per step, then one saying how many more the
# summary has: GitHub drops the eleventh on with no notice (#441). A job
# cancelled or timed out, or one that stops before that step (checkout, a
# tool install, floor-check's fetch), writes none, and its red or cancelled
# conclusion is the verdict.
# In deps on a pull request the review action's own summary comes first. The
# conclusion does not carry it: the ruleset accepts neutral and skipped as it
# accepts success. Where the lines depend on earlier steps, a Verdict step
# runs `if: ${{ !cancelled() }}`, so it reports after a failed step too; a
# step that did not run is not yet confirmed. pr-title, diff-size and
# floor-check write theirs in the step that checks.
#
# Check names are `{caller job} / {job here}`. The caller job is named `ci`,
# so rulesets require `ci / lint` and so on. Renaming a job here is a MAJOR
# change: every consumer ruleset requires the old name forever.

on:
  workflow_call:
    inputs:
      working-directory:
        description: |
          Project root. Defaults to the repository root. This repository's
          canary job passes `canary/` to call the workflow for real; a
          workflow that parses is not the same as a workflow that runs.
        type: string
        default: "."

      max-diff-lines:
        description: |
          Upper bound on the lines one pull request may change for review
          (added + removed). `0` measures without blocking.
        type: number
        default: 400

      deps-fail-on-severity:
        description: |
          Lowest vulnerability severity `ci / deps` blocks on:
          `critical|high|moderate|low`. Not the same thing as Dependabot:
          Dependabot alerts and opens update PRs after the fact; this check
          stops a vulnerable dependency from entering through a PR.
        type: string
        default: high

      diff-size-exclude:
        description: |
          Path patterns left out of the diff count, space separated, passed
          as git pathspecs. Docs and lockfiles are the default because a line
          of prose and a line that must pass `mypy --strict` are not the same
          review burden.
        type: string
        default: "*.md *.lock *lock.json *lock.yaml *lock.yml LICENSE"

      extra-python-versions:
        description: |
          Python versions to test in addition to `.python-version`, space
          separated (for example "3.13 3.14"). A library that declares
          `>=3.12` and tests only 3.12 claims support it never exercised.

          No `strategy.matrix`: a matrix splits the check name into
          `ci / test (3.13)` and every consumer would have to edit its
          ruleset. Running in one job keeps the name `ci / test`.
        required: false
        type: string
        default: ""

      floor-check-required-checks:
        description: |
          Check names the repository's ruleset must require, comma separated.
          Empty means the nine names in plinth's ruleset.json, the ruleset
          `/plinth:new-project` applies. Only a repository whose ruleset is
          deliberately different passes its own list; plinth's canary does.
        required: false
        type: string
        default: ""

      web:
        description: |
          `true` for a project of plinth-template's `web` archetype (Django
          and Postgres). It turns on `ci / migrations` and `ci / deploy-check`
          and gives `ci / test` a disposable Postgres. Passed explicitly in
          the rendered `ci.yml`, never read from which files exist: moving a
          file must not turn a check into "does not apply" (#614). Renaming
          it is a MAJOR change.
        required: false
        type: boolean
        default: false

# The default token is write-broad. Lower it to the minimum.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout leaves the token in .git/config by default; uploading the
          # workspace as an artifact would ship it (zizmor `artipacked`).
          # Nothing here pushes, so it is turned off.
          persist-credentials: false
      - name: Install uv (official release, SHA256 verified)
        env:
          UV_VERSION: "0.12.9"
          UV_SHA256: "ec7a99cd05e0cd7f80243f135ce1361c76835cb0ee60055d14d20eba8eba1460"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/uv"; mkdir -p "$d"
          f="uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$d/$f" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/$f"
          echo "${UV_SHA256}  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" --strip-components=1 "${f%.tar.gz}/uv" "${f%.tar.gz}/uvx"
          echo "$d" >> "$GITHUB_PATH"
      # --locked fails when the lockfile is missing or disagrees with
      # pyproject. A committed lockfile is a precondition, not a check.
      - id: sync
        run: uv sync --locked
      - id: check
        run: uv run ruff check .
      - id: format
        run: uv run ruff format --check .

      # Workflow security static analysis. actionlint checks correctness,
      # zizmor checks security: template injection, credential leaks, cache
      # poisoning, impostor commits. Pinned, so a new audit rule does not turn
      # consumer CI red on an unrelated day. Only medium and above blocks here:
      # this runs in other people's repositories and low findings have low
      # confidence.
      # The job's token is passed so the audits of a `uses:` pin (impostor
      # commit, ref confusion) run; the job's permissions stay as they are.
      # known-vulnerable-actions reads GitHub's advisory database live, so a
      # new advisory would turn CI red with no change here: for the same
      # reason as the pin, it is reported (the Verdict step's not yet
      # confirmed lines) and never fails the step. Every other finding does.
      - name: Workflow security (zizmor, medium and above)
        id: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          uvx zizmor@1.29.0 --no-progress --min-severity medium --format json .github/workflows/ > "$RUNNER_TEMP/zizmor.json" || rc=$?
          case "$rc" in 0|1[1-4]) ;; *) echo "zizmor exited $rc: an error, not a finding"; exit 1 ;; esac
          jq -e 'type == "array"' "$RUNNER_TEMP/zizmor.json" > /dev/null || { echo "zizmor's output is not a JSON list of findings"; exit 1; }
          # Each finding's primary location as file:line; newlines are
          # flattened so no text from a workflow starts a command.
          defs='def found: .[] | select(.ignored != true);
            def loc: (.locations | (map(select(.symbolic.kind == "Primary")) + .)[0]);
            def at: "\(.symbolic.key.Local.verbatim_path // .symbolic.key.Local.given_path // "?"):\((.concrete.location.start_point.row // -1) + 1)";
            def line: gsub("[\r\n]"; " ");'
          # One line per finding in the log: ident, severity, location, annotation.
          jq -r "$defs"' found | loc as $l | "\(.ident) \(.determinations.severity) \($l | at) \($l.symbolic.annotation // "")" | line' "$RUNNER_TEMP/zizmor.json"
          # The advisories, one line each, for the Verdict step: advisory, action@ref, location.
          jq -r "$defs"' found | select(.ident == "known-vulnerable-actions") | loc
            | "\(.symbolic.annotation // "an advisory") for \(.concrete.feature // "?" | split("\n")[0] | sub("^\\s*uses:\\s*"; "")) (\(at))" | line' \
            "$RUNNER_TEMP/zizmor.json" > "$RUNNER_TEMP/zizmor.kva.tmp"
          mv "$RUNNER_TEMP/zizmor.kva.tmp" "$RUNNER_TEMP/zizmor.kva"
          n="$(jq "$defs"' [found | select(.ident != "known-vulnerable-actions")] | length' "$RUNNER_TEMP/zizmor.json")"
          echo "zizmor: $n finding(s) that block, $(wc -l < "$RUNNER_TEMP/zizmor.kva" | tr -d ' ') known-vulnerable-actions reported only"
          [ "$n" = 0 ]
        working-directory: ${{ github.workspace }}

      - name: Verdict
        if: ${{ !cancelled() }}
        env:
          SYNC: ${{ steps.sync.outcome }}
          CHECK: ${{ steps.check.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          ZIZMOR: ${{ steps.zizmor.outcome }}
        run: |
          nw=0; trap '[ "$nw" -le 9 ] || echo "::warning::$((nw - 9)) more not yet confirmed lines are in the job summary"' EXIT
          say() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; case "$1" in *"; left to /plinth:floor-check") ;; "not yet confirmed: "*) nw=$((nw + 1)); if [ "$nw" -le 9 ]; then w="${1//'%'/%25}"; w="${w//$'\r'/%0D}"; echo "::warning::${w//$'\n'/%0A}"; fi ;; esac; }
          v() { case "$1" in success) say "pass: $2" ;; failure) say "fail: $2" ;; *) say "not yet confirmed: $2, it did not run because an earlier step failed; a run that gets past that step confirms it" ;; esac; }
          v "$SYNC" "uv sync --locked"
          v "$CHECK" "ruff check"
          v "$FORMAT" "ruff format --check"
          v "$ZIZMOR" "zizmor's audits at medium and above, offline and online, except known-vulnerable-actions"
          kva="$RUNNER_TEMP/zizmor.kva"
          if [ ! -f "$kva" ]; then say "not yet confirmed: no published advisory at medium or above for an action pinned here (zizmor known-vulnerable-actions), zizmor did not finish; a run where it does confirms it"
          elif [ ! -s "$kva" ]; then say "pass: no published advisory at medium or above for an action pinned here (zizmor known-vulnerable-actions)"
          else while IFS= read -r a; do say "not yet confirmed: $a, a published advisory (zizmor known-vulnerable-actions), reported and not blocking; a pin raised past the advisory's fixed version confirms it"; done < "$kva"; fi

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes (zizmor `artipacked`)
      - name: Install uv (official release, SHA256 verified)
        env:
          UV_VERSION: "0.12.9"
          UV_SHA256: "ec7a99cd05e0cd7f80243f135ce1361c76835cb0ee60055d14d20eba8eba1460"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/uv"; mkdir -p "$d"
          f="uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$d/$f" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/$f"
          echo "${UV_SHA256}  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" --strip-components=1 "${f%.tar.gz}/uv" "${f%.tar.gz}/uvx"
          echo "$d" >> "$GITHUB_PATH"
      - id: sync
        run: uv sync --locked
      - id: mypy
        run: uv run mypy .
      - name: Verdict
        if: ${{ !cancelled() }}
        env:
          SYNC: ${{ steps.sync.outcome }}
          MYPY: ${{ steps.mypy.outcome }}
        run: |
          nw=0; trap '[ "$nw" -le 9 ] || echo "::warning::$((nw - 9)) more not yet confirmed lines are in the job summary"' EXIT
          say() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; case "$1" in *"; left to /plinth:floor-check") ;; "not yet confirmed: "*) nw=$((nw + 1)); if [ "$nw" -le 9 ]; then w="${1//'%'/%25}"; w="${w//$'\r'/%0D}"; echo "::warning::${w//$'\n'/%0A}"; fi ;; esac; }
          v() { case "$1" in success) say "pass: $2" ;; failure) say "fail: $2" ;; *) say "not yet confirmed: $2, it did not run because an earlier step failed; a run that gets past that step confirms it" ;; esac; }
          v "$SYNC" "uv sync --locked"
          v "$MYPY" "mypy"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes (zizmor `artipacked`)
          # On a pull request the checkout is GitHub's merge commit; its
          # first parent, HEAD^1, is the base the changed lines are judged
          # against.
          fetch-depth: 2
      - name: Install uv (official release, SHA256 verified)
        env:
          UV_VERSION: "0.12.9"
          UV_SHA256: "ec7a99cd05e0cd7f80243f135ce1361c76835cb0ee60055d14d20eba8eba1460"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/uv"; mkdir -p "$d"
          f="uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$d/$f" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/$f"
          echo "${UV_SHA256}  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" --strip-components=1 "${f%.tar.gz}/uv" "${f%.tar.gz}/uvx"
          echo "$d" >> "$GITHUB_PATH"
      - id: sync
        run: uv sync --locked
      # A web project's tests run against Postgres, not the SQLite its
      # settings fall back to without DATABASE_URL (#614).
      - name: Start Postgres
        id: pg
        if: inputs.web
        working-directory: .
        run: |
          set -euo pipefail
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -p 5432:5432 \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          # Over TCP: on first start the image runs a temporary server on the
          # socket only, then restarts it, so a socket probe can answer before
          # the real server is up.
          for _ in $(seq 60); do docker exec pg pg_isready -h 127.0.0.1 -U postgres -q && break; sleep 1; done
          docker exec pg pg_isready -h 127.0.0.1 -U postgres
          echo "DATABASE_URL=postgres://postgres:ci@localhost:5432/postgres" >> "$GITHUB_ENV"
      # Coverage comes from the workflow, not the project (#406, #503): it
      # goes into the synced environment, so uv.lock is untouched, and
      # pytest-cov in the template's addopts would break the extra-versions
      # step. The release #406 measured, each file pinned by its hash:
      # `uv run --with` and `uvx` install a file whose hash does not match,
      # `uv pip install --require-hashes` refuses it. The wheels are CPython
      # 3.10 to 3.14 on Linux x86_64 and the pure-Python one, and before 3.11
      # tomli, coverage's `toml` extra, which reads pyproject.toml. A coverage the
      # lock already carries (pytest-cov's, say) is used as locked: installing
      # over it would run the tests against an environment uv.lock does not
      # describe. A failed install never fails the job: pytest then runs
      # without coverage and the changed lines are not yet confirmed.
      - name: Install coverage
        id: cov
        continue-on-error: true
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/coverage-requirements.txt"
          cat > "$r" <<'REQ'
          coverage==7.10.7 \
              --hash=sha256:8421e088bc051361b01c4b3a50fd39a4b9133079a2229978d9d30511fd05231b \
              --hash=sha256:35f5e3f9e455bb17831876048355dca0f758b6df22f49258cb5a91da23ef437d \
              --hash=sha256:314f2c326ded3f4b09be11bc282eb2fc861184bc95748ae67b360ac962770be7 \
              --hash=sha256:10b6ba00ab1132a0ce4428ff68cf50a25efd6840a42cdf4239c9b99aad83be8b \
              --hash=sha256:bb45474711ba385c46a0bfe696c695a929ae69ac636cda8f532be9e8c93d720a \
              --hash=sha256:f7941f6f2fe6dd6807a1208737b8a0cbcf1cc6d7b07d24998ad2d63590868260
          tomli==2.2.1 ; python_version < "3.11" \
              --hash=sha256:cb55c73c5f4408779d0cf3eef9f762b9c9f147a77de7b258bef0a5628adc85cc
          REQ
          if uv run --no-sync python -c 'import coverage' 2>/dev/null; then
            echo "coverage is in the locked environment: used as locked, nothing installed"
          else
            uv pip install --python .venv --require-hashes --no-deps -r "$r"
          fi
          uv run --no-sync coverage --version
      # Under coverage when it installed; the exit code is pytest's either way.
      - id: pytest
        env:
          COV: ${{ steps.cov.outcome }}
        run: |
          if [ "$COV" != success ]; then exec uv run pytest; fi
          src=.; [ -d src ] && src=src
          exec uv run --no-sync coverage run --branch --source="$src" -m pytest

      # Which of the lines a pull request changes ran under the tests (#503).
      # Reported, never failing (#503's Decisions, 2026-10-12): the verdict
      # lines go to a file the Verdict step writes, and a step that breaks
      # leaves no file, which the Verdict step reports as not yet confirmed.
      # A changed Python file coverage's report does not have (outside the
      # measured source, or omitted by the project's configuration) has no
      # lines in diff-cover's report either: it is named, not passed.
      # Test files are left out by diff-size's TEST pattern. A line only a
      # live service or the entry point runs carries `# pragma: no cover`
      # with its reason, which diff-size lists.
      - name: Changed lines under the tests
        id: changed
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          PR: ${{ github.event.pull_request.number }}
          COV: ${{ steps.cov.outcome }}
          PYTEST: ${{ steps.pytest.outcome }}
        run: |
          std="changed lines ran under the tests"
          out="$RUNNER_TEMP/changed.verdict"; rm -f "$out"
          if [ -z "$PR" ]; then echo "pass: $std, does not apply (not a pull request)" > "$out"; exit 0; fi
          if [ "$COV" != success ] || [ "$PYTEST" != success ]; then
            echo "not yet confirmed: $std, it did not run because an earlier step failed; a run that gets past that step confirms it" > "$out"; exit 0
          fi
          xml="$RUNNER_TEMP/coverage.xml"; json="$RUNNER_TEMP/diff-cover.json"; rm -f "$xml" "$json"
          uv run --no-sync coverage xml -o "$xml" || true
          # diff-cover in its own environment, every file pinned by its hash
          # (the wheels a CPython 3.12 Linux x86_64 environment installs).
          r="$RUNNER_TEMP/diff-cover-requirements.txt"; d="$RUNNER_TEMP/diff-cover"
          cat > "$r" <<'REQ'
          diff-cover==9.7.1 \
              --hash=sha256:a662f3cacf57ba494dcb0235349c4912ae7f44345b162894ce5949745501c9c7
          chardet==5.2.0 \
              --hash=sha256:e1cf59446890a00105fe7b7912492ea04b6e6f06d4b742b2c788469e34c82970
          jinja2==3.1.6 \
              --hash=sha256:85ece4451f492d0c13c5dd7c13a64681a86afae63a5f347908daf103ce6d2f67
          markupsafe==3.0.3 \
              --hash=sha256:d6dd0be5b5b189d31db7cda48b91d7e0a9795f31430b7f271219ab30f1d3ac9d
          pluggy==1.6.0 \
              --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
          pygments==2.19.2 \
              --hash=sha256:86540386c03d588bb81d44bc3928634ff26449851e99741617ecb9037ee5ec0b
          REQ
          if [ -s "$xml" ] && uv venv -q --python 3.12 "$d" && uv pip install -q --python "$d" --require-hashes -r "$r"; then
            "$d/bin/diff-cover" "$xml" --compare-branch=HEAD^1 --format "json:$json" || true
          fi
          changed="$RUNNER_TEMP/changed-python.txt"; top="$(git rev-parse --show-toplevel || true)"
          git diff --name-only --diff-filter=d HEAD^1 HEAD -- '*.py' > "$changed" || rm -f "$changed"
          python3 - "$xml" "$json" "$out" "$changed" "$top" <<'PY'
          import json, os, re, sys
          import xml.etree.ElementTree as ET
          xml, report, out, changed, top = sys.argv[1:6]
          STD = "changed lines ran under the tests"
          TEST = re.compile(r"(^|/)tests?/|(^|/)test_[^/]*\.py$|_test\.py$")   # diff-size's
          CONFIRMS = "a test that runs them, or `# pragma: no cover` with its reason, confirms it"
          def say(*lines):
              with open(out, "w", encoding="utf-8") as f:
                  f.writelines(s + "\n" for s in lines)
          def clean(p):
              return re.sub(r"[\x00-\x1f\x7f]", "?", p)
          try:
              root = ET.parse(xml).getroot()
              covered = int(root.get("lines-covered", "0"))
          except (OSError, ET.ParseError, ValueError):
              root, covered = None, 0   # `coverage xml` writes nothing when it has no data
          if covered == 0:
              say(f"not yet confirmed: {STD}, coverage recorded no line in the whole project, "
                  "usually because another tool owns the tracer (pytest-cov's --cov in the "
                  "project's addopts); a run where coverage records lines confirms it")
              sys.exit(0)
          try:
              with open(report, encoding="utf-8") as f:
                  stats = json.load(f)["src_stats"]
          except (OSError, ValueError, KeyError, TypeError):
              say(f"not yet confirmed: {STD}, diff-cover did not finish (its error is in this "
                  "step's log); a run where it does confirms it")
              sys.exit(0)
          try:
              with open(changed, encoding="utf-8") as f:
                  files = [l for l in f.read().splitlines() if l and not TEST.search(l)]
          except OSError:
              say(f"not yet confirmed: {STD}, git did not list the changed files (its error is in "
                  "this step's log); a run where it does confirms it")
              sys.exit(0)
          # The files coverage's report has, as paths from the repository root,
          # and every file diff-cover matched in it.
          measured = {os.path.relpath(os.path.normpath(os.path.join(s.text or "", c.get("filename", ""))), top)
                      for s in root.iter("source") for c in root.iter("class")} | set(stats)
          unmeasured = [clean(f) for f in files if f not in measured]
          for f in unmeasured:
              print(f"not in coverage's report: {f}")
          extra = []
          if unmeasured:
              listed = ", ".join(unmeasured[:9]) + (f", and {len(unmeasured) - 9} more in this step's log"
                                                    if len(unmeasured) > 9 else "")
              extra = [f"not yet confirmed: {STD}, {len(unmeasured)} changed Python files are not in "
                       "coverage's report (outside the measured source, or omitted by the project's "
                       f"coverage configuration): {listed}; a run that measures them confirms it"]
          def ranges(ns):
              ns, rs = sorted(set(ns)), []
              for n in ns:
                  if rs and n == rs[-1][1] + 1:
                      rs[-1][1] = n
                  else:
                      rs.append([n, n])
              return ",".join(str(a) if a == b else f"{a}-{b}" for a, b in rs)
          stats = {p: s for p, s in stats.items() if not TEST.search(p)}
          total = sum(len(set(s["covered_lines"]) | set(s["violation_lines"])) for s in stats.values())
          missed = [(clean(p), s["violation_lines"])
                    for p, s in sorted(stats.items()) if s["violation_lines"]]
          n = sum(len(set(v)) for _, v in missed)
          for p, v in missed:   # every file, past the nine the verdict line names
              print(f"did not run under the tests: {p}:{ranges(v)}")
          shown = ", ".join(f"{p}:{ranges(v)}" for p, v in missed[:9])
          if len(missed) > 9:
              shown += f", and {len(missed) - 9} more files in this step's log"
          if total == 0:
              say(*(extra or [f"pass: {STD}, does not apply (no changed executable line)"]))
          elif n == 0:
              say(f"pass: {STD}, all {total} changed lines ran", *extra)
          elif n == total:
              say(f"not yet confirmed: none of the {n} changed lines ran under the tests: {shown}; {CONFIRMS}", *extra)
          else:
              say(f"not yet confirmed: {n} of {total} changed lines did not run under the tests: {shown}; {CONFIRMS}", *extra)
          PY

      # Exercise the declared range for real. Empty input: this step does
      # nothing. uv downloads the interpreter, so the runner needs no preinstall.
      - name: Also on the extra Python versions
        id: extra
        if: inputs.extra-python-versions != ''
        env:
          VERSIONS: ${{ inputs.extra-python-versions }}
        run: |
          set -euo pipefail
          for v in $VERSIONS; do
            echo "── python $v"
            uv run --isolated --python "$v" --with pytest pytest -q
          done

      - name: Verdict
        if: ${{ !cancelled() }}
        env:
          SYNC: ${{ steps.sync.outcome }}
          PYTEST: ${{ steps.pytest.outcome }}
          EXTRA: ${{ steps.extra.outcome }}
          VERSIONS: ${{ inputs.extra-python-versions }}
          WEB: ${{ inputs.web }}
          PG: ${{ steps.pg.outcome }}
        run: |
          nw=0; trap '[ "$nw" -le 9 ] || echo "::warning::$((nw - 9)) more not yet confirmed lines are in the job summary"' EXIT
          say() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; case "$1" in *"; left to /plinth:floor-check") ;; "not yet confirmed: "*) nw=$((nw + 1)); if [ "$nw" -le 9 ]; then w="${1//'%'/%25}"; w="${w//$'\r'/%0D}"; echo "::warning::${w//$'\n'/%0A}"; fi ;; esac; }
          v() { case "$1" in success) say "pass: $2" ;; failure) say "fail: $2" ;; *) say "not yet confirmed: $2, it did not run because an earlier step failed; a run that gets past that step confirms it" ;; esac; }
          v "$SYNC" "uv sync --locked"
          if [ "$WEB" = true ]; then v "$PG" "a disposable Postgres for the tests"; fi
          v "$PYTEST" "pytest on .python-version"
          if [ -n "$VERSIONS" ]; then v "$EXTRA" "pytest on $VERSIONS"
          else say "pass: pytest on extra Python versions, does not apply (the extra-python-versions input is empty)"; fi
          if [ -s "$RUNNER_TEMP/changed.verdict" ]; then while IFS= read -r l; do [ -z "$l" ] || say "$l"; done < "$RUNNER_TEMP/changed.verdict"
          else say "not yet confirmed: changed lines ran under the tests, the judging step did not finish (its error is in its log); a run where it does confirms it"; fi

  # The schema of a `web` project (#614): no model change without its
  # migration, the migrations applied to an empty Postgres, and the base
  # commit's representative rows carried through this head's migrations. With
  # the `web` input false every step but the verdict is skipped and the job
  # reports a pass that does not apply: the job itself always runs, so its
  # check name always reports.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.web
        with:
          persist-credentials: false   # nothing here pushes (zizmor `artipacked`)
          # On a pull request the checkout is GitHub's merge commit, on a push
          # the branch's new tip: either way HEAD^1 is the base.
          fetch-depth: 2
      - name: Install uv (official release, SHA256 verified)
        if: inputs.web
        env:
          UV_VERSION: "0.12.9"
          UV_SHA256: "ec7a99cd05e0cd7f80243f135ce1361c76835cb0ee60055d14d20eba8eba1460"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/uv"; mkdir -p "$d"
          f="uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$d/$f" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/$f"
          echo "${UV_SHA256}  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" --strip-components=1 "${f%.tar.gz}/uv" "${f%.tar.gz}/uvx"
          echo "$d" >> "$GITHUB_PATH"
      # A disposable Postgres, pinned by digest: `empty` for the migrations
      # from nothing, `rows` for the base's rows carried forward.
      - name: Start Postgres
        id: pg
        if: inputs.web
        working-directory: .
        run: |
          set -euo pipefail
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -p 5432:5432 \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          # Over TCP: on first start the image runs a temporary server on the
          # socket only, then restarts it, so a socket probe can answer before
          # the real server is up.
          for _ in $(seq 60); do docker exec pg pg_isready -h 127.0.0.1 -U postgres -q && break; sleep 1; done
          docker exec pg pg_isready -h 127.0.0.1 -U postgres
          docker exec pg createdb -U postgres empty
          docker exec pg createdb -U postgres rows
      - id: sync
        if: inputs.web
        run: uv sync --locked
      # Every app with models is named. Unnamed, an app whose migrations
      # package was moved or deleted counts as "unmigrated" and the check says
      # "No changes detected": the schema would leave version control quietly.
      - id: missing
        if: inputs.web
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/empty
        run: |
          set -euo pipefail
          labels="$(uv run python manage.py shell -v 0 -c 'from django.apps import apps; print(" ".join(a.label for a in apps.get_app_configs() if a.models_module))')"
          echo "apps with models: $labels"
          # shellcheck disable=SC2086 # one argument per app label
          uv run python manage.py makemigrations --check --dry-run $labels
      - id: empty
        if: inputs.web
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/empty
        run: |
          uv run python manage.py migrate --no-input
      # The rows come from the base commit, never the head: a pull request
      # that edited them could hide its own loss, and an edit to the file is a
      # change to the checks a person approves (#614). Compared: the table of
      # every model the file holds rows for, and their many-to-many tables (a
      # user's groups). migrate rewrites three, so the file may not hold them.
      - id: rows
        if: inputs.web
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/rows
          WD: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rows.verdict"; : > "$out"
          std="the base commit's rows survive this head's migrations"
          rel="$(git rev-parse --show-prefix)tests/migration_rows.json"
          if ! git cat-file -e "HEAD^1:$rel" 2>/dev/null; then
            echo "not yet confirmed: $std, the base commit has no tests/migration_rows.json; a base that has it confirms it" > "$out"
            exit 0
          fi
          export ROWS="$RUNNER_TEMP/rows.json" COUNTS="$RUNNER_TEMP/counts.json"
          git show "HEAD^1:$rel" > "$ROWS"
          python3 - <<'PY' || { echo "fail: $std, tests/migration_rows.json holds a model migrate rewrites (its name is in this step's log)" > "$out"; exit 1; }
          import json, os, sys
          held = {r["model"].lower() for r in json.load(open(os.environ["ROWS"], encoding="utf-8"))}
          bad = sorted(held & {"contenttypes.contenttype", "auth.permission", "sessions.session"})
          if bad:
              print(f"tests/migration_rows.json may not hold {', '.join(bad)}: migrate rewrites them")
              sys.exit(1)
          PY
          base="$RUNNER_TEMP/base"
          git worktree add --quiet --detach "$base" HEAD^1
          count='
          import json, os
          from django.apps import apps
          from django.db import connection
          q = connection.ops.quote_name
          base = os.environ.get("BASE_TABLES")
          if base:
              tables = json.load(open(base))
          else:
              held = [apps.get_model(r["model"]) for r in json.load(open(os.environ["ROWS"]))]
              tables = sorted({m._meta.db_table for m in held}
                              | {f.remote_field.through._meta.db_table
                                 for m in held for f in m._meta.many_to_many})
          found = {}
          with connection.cursor() as c:
              for t in tables:
                  try:
                      c.execute(f"SELECT count(*) FROM {q(t)}")
                      found[t] = c.fetchone()[0]
                  except Exception:
                      found[t] = None
          json.dump(found, open(os.environ["COUNTS"], "w"))
          '
          (cd "$base/$WD" && uv sync --locked --quiet \
            && uv run python manage.py migrate --no-input \
            && uv run python manage.py loaddata "$ROWS" \
            && uv run python manage.py shell -c "$count")
          cp "$COUNTS" "$RUNNER_TEMP/before.json"
          python3 -c 'import json,os; json.dump(sorted(json.load(open(os.environ["COUNTS"]))), open(os.environ["RUNNER_TEMP"]+"/tables.json","w"))'
          uv run python manage.py migrate --no-input
          BASE_TABLES="$RUNNER_TEMP/tables.json" uv run python manage.py shell -c "$count"
          python3 - "$RUNNER_TEMP/before.json" "$COUNTS" "$std" "$out" <<'PY'
          import json, sys
          before, after = (json.load(open(p)) for p in sys.argv[1:3])
          std, out = sys.argv[3], sys.argv[4]
          lost = [f"{t} {n} -> {'no table' if after.get(t) is None else after[t]}"
                  for t, n in sorted(before.items()) if after.get(t) != n]
          for l in lost:
              print(f"changed: {l}")
          with open(out, "w") as f:
              if lost:
                  f.write(f"fail: {std}: {'; '.join(lost[:9])}" + (", and more in this step's log" if len(lost) > 9 else "") + "\n")
              else:
                  f.write(f"pass: {std}, {len(before)} tables, every count the same\n")
          sys.exit(1 if lost else 0)
          PY
      - name: Verdict
        if: ${{ !cancelled() }}
        env:
          WEB: ${{ inputs.web }}
          SYNC: ${{ steps.sync.outcome }}
          PG: ${{ steps.pg.outcome }}
          MISSING: ${{ steps.missing.outcome }}
          EMPTY: ${{ steps.empty.outcome }}
          ROWS: ${{ steps.rows.outcome }}
        working-directory: .
        run: |
          nw=0; trap '[ "$nw" -le 9 ] || echo "::warning::$((nw - 9)) more not yet confirmed lines are in the job summary"' EXIT
          say() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; case "$1" in *"; left to /plinth:floor-check") ;; "not yet confirmed: "*) nw=$((nw + 1)); if [ "$nw" -le 9 ]; then w="${1//'%'/%25}"; w="${w//$'\r'/%0D}"; echo "::warning::${w//$'\n'/%0A}"; fi ;; esac; }
          v() { case "$1" in success) say "pass: $2" ;; failure) say "fail: $2" ;; *) say "not yet confirmed: $2, it did not run because an earlier step failed; a run that gets past that step confirms it" ;; esac; }
          if [ "$WEB" != true ]; then
            say "pass: migrations, does not apply (the web input is false: not a web project)"
            exit 0
          fi
          v "$PG" "a disposable Postgres"
          v "$SYNC" "uv sync --locked"
          v "$MISSING" "no model change without its migration (makemigrations --check)"
          v "$EMPTY" "the migrations apply to an empty Postgres"
          if [ -s "$RUNNER_TEMP/rows.verdict" ]; then say "$(cat "$RUNNER_TEMP/rows.verdict")"
          else v "$ROWS" "the base commit's rows survive this head's migrations"; fi

  # The production settings of a `web` project (#614): Django's deployment
  # checks at the warning level, with settings shaped like production (debug
  # off, a key made for this run, placeholder hosts and database). Another
  # archetype reports a pass that does not apply.
  deploy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.web
        with:
          persist-credentials: false   # nothing here pushes (zizmor `artipacked`)
      - name: Install uv (official release, SHA256 verified)
        if: inputs.web
        env:
          UV_VERSION: "0.12.9"
          UV_SHA256: "ec7a99cd05e0cd7f80243f135ce1361c76835cb0ee60055d14d20eba8eba1460"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/uv"; mkdir -p "$d"
          f="uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$d/$f" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/$f"
          echo "${UV_SHA256}  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" --strip-components=1 "${f%.tar.gz}/uv" "${f%.tar.gz}/uvx"
          echo "$d" >> "$GITHUB_PATH"
      - id: sync
        if: inputs.web
        run: uv sync --locked
      # No literal key: one made for this run. Nothing here reaches a database.
      - id: deploy
        if: inputs.web
        env:
          DJANGO_ALLOWED_HOSTS: deploy-check.invalid
          DATABASE_URL: postgres://deploy-check@localhost:5432/none
        run: |
          set -euo pipefail
          unset DJANGO_DEBUG
          DJANGO_SECRET_KEY="$(openssl rand -hex 32)" uv run python manage.py check --deploy --fail-level WARNING
      - name: Verdict
        if: ${{ !cancelled() }}
        env:
          WEB: ${{ inputs.web }}
          SYNC: ${{ steps.sync.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
        working-directory: .
        run: |
          nw=0; trap '[ "$nw" -le 9 ] || echo "::warning::$((nw - 9)) more not yet confirmed lines are in the job summary"' EXIT
          say() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; case "$1" in *"; left to /plinth:floor-check") ;; "not yet confirmed: "*) nw=$((nw + 1)); if [ "$nw" -le 9 ]; then w="${1//'%'/%25}"; w="${w//$'\r'/%0D}"; echo "::warning::${w//$'\n'/%0A}"; fi ;; esac; }
          v() { case "$1" in success) say "pass: $2" ;; failure) say "fail: $2" ;; *) say "not yet confirmed: $2, it did not run because an earlier step failed; a run that gets past that step confirms it" ;; esac; }
          if [ "$WEB" != true ]; then
            say "pass: deploy-check, does not apply (the web input is false: not a web project)"
            exit 0
          fi
          v "$SYNC" "uv sync --locked"
          v "$DEPLOY" "manage.py check --deploy --fail-level WARNING with production-shaped settings (the warnings are in the deploy step's log)"

  # Secret detection. Not a duplicate of push protection: push protection
  # blocks provider-format tokens only and lets private-key PEMs and generic
  # secrets through; gitleaks catches those. This is a check, not a wall: by
  # the time it runs the secret is already on GitHub. Push protection blocks,
  # this blocks the merge and tells you. Separate job so a hit reads as
  # "secret", not "lint failed".
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history; `gitleaks git` below needs it
          persist-credentials: false   # nothing here pushes (zizmor `artipacked`)
      # Official release binary, checksum verified: no third-party action to
      # allowlist. Bump the version and the checksum together.
      - name: Install gitleaks (official release, SHA256 verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/gitleaks"; mkdir -p "$d"
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$d/$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" gitleaks
          echo "$d" >> "$GITHUB_PATH"
      # `git`, not `dir`: `dir` scans the current files only. Fetching history
      # and then scanning `dir` would look at nothing that was deleted, and a
      # deleted secret is still in history.
      - name: Secret detection, history included
        id: gitleaks
        working-directory: ${{ inputs.working-directory }}
        run: gitleaks git . --no-banner --redact
      - name: Verdict
        if: ${{ !cancelled() }}
        env:
          GITLEAKS: ${{ steps.gitleaks.outcome }}
        run: |
          nw=0; trap '[ "$nw" -le 9 ] || echo "::warning::$((nw - 9)) more not yet confirmed lines are in the job summary"' EXIT
          say() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; case "$1" in *"; left to /plinth:floor-check") ;; "not yet confirmed: "*) nw=$((nw + 1)); if [ "$nw" -le 9 ]; then w="${1//'%'/%25}"; w="${w//$'\r'/%0D}"; echo "::warning::${w//$'\n'/%0A}"; fi ;; esac; }
          v() { case "$1" in success) say "pass: $2" ;; failure) say "fail: $2" ;; *) say "not yet confirmed: $2, it did not run because an earlier step failed; a run that gets past that step confirms it" ;; esac; }
          v "$GITLEAKS" "gitleaks, the history included"

  # PR title is Conventional Commits with the standard eleven types only.
  #
  # Why the title: merges are squash-only, so the PR title is the landing
  # commit; branch commits are flattened and carry no weight.
  #
  # Why only the standard vocabulary: an extended list kept in a document did
  # not survive a day. With the list in front of it an agent still coined new
  # types on the spot, and both were really `docs:`. A model reaches for the
  # list it was trained on. The spec mandates only feat and fix, and scope is
  # free-form, so local meaning goes into the scope (`docs(research):`).
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          nw=0; trap '[ "$nw" -le 9 ] || echo "::warning::$((nw - 9)) more not yet confirmed lines are in the job summary"' EXIT
          say() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; case "$1" in *"; left to /plinth:floor-check") ;; "not yet confirmed: "*) nw=$((nw + 1)); if [ "$nw" -le 9 ]; then w="${1//'%'/%25}"; w="${w//$'\r'/%0D}"; echo "::warning::${w//$'\n'/%0A}"; fi ;; esac; }

          # Not a PR: report a pass instead of skipping the job. A job skipped
          # with `if:` has no check name, and the day a ruleset requires that
          # name the repository quietly locks.
          if [ -z "${TITLE:-}" ]; then
            echo "Not a pull request: no title to check."
            say "pass: PR title, does not apply (not a pull request: no title to check)"
            exit 0
          fi

          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          if printf '%s' "$TITLE" | grep -qE "^($types)(\([a-zA-Z0-9_.,/ -]+\))?!?: .+"; then
            # A squash merge appends the pull request's own number to its
            # title, so a title that already ends in one lands on main with
            # two: `fix: x (#349) (#359)`. The issue belongs on the
            # description's closing or `Part of` line instead.
            if printf '%s' "$TITLE" | grep -qE '\(#[0-9]+\)[[:space:]]*$'; then # trailing-number
              echo "::error::PR title ends in a number: ${TITLE}. The squash merge adds this pull request's own number; name the issue in the description instead."
              say "fail: PR title, it ends in a number"
              {
                echo "### PR title ends in a number"
                echo
                echo "\`\`\`"
                echo "$TITLE"
                echo "\`\`\`"
                echo
                echo "A squash merge appends this pull request's own number, so the commit on the"
                echo "default branch would carry two. Drop the trailing \`(#N)\` and name the issue"
                echo "in the description: \`Closes #N\` when this completes it, \`Part of #N\` otherwise."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "OK: $TITLE"
            say "pass: PR title follows the convention"
            exit 0
          fi

          echo "::error::PR title is not Conventional Commits: ${TITLE}"
          say "fail: PR title, it is not Conventional Commits"
          {
            echo "### PR title does not follow the convention"
            echo
            echo "\`\`\`"
            echo "$TITLE"
            echo "\`\`\`"
            echo
            echo "**Format**: \`type(scope): summary\`, or \`type(scope)!: summary\` for a breaking change"
            echo
            echo "**Types are these eleven only** (\`@commitlint/config-conventional\`):"
            echo "\`feat\` \`fix\` \`docs\` \`style\` \`refactor\` \`perf\` \`test\` \`build\` \`ci\` \`chore\` \`revert\`"
            echo
            echo "Local meaning goes into the scope. Do not invent a type:"
            echo "| you wanted | write |"
            echo "|---|---|"
            echo "| \`research:\` \`record:\` \`anchor:\` | \`docs(research):\` \`docs:\` |"
            echo "| \`decide:\` \`decision:\` \`audit:\` | \`docs(decision):\` \`docs(audit):\` |"
            echo "| \`move:\` | \`refactor(layout):\` |"
            echo "| \`deps:\` \`security:\` | \`build(deps):\` \`fix(security):\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # A wall, not a net. Dependabot reports what already got in; this job
  # blocks what a PR is bringing in. The dependency graph must be enabled
  # (it is by default on public repositories). On a private repository
  # without GitHub Code Security GitHub refuses the review, and the job says
  # it checked nothing (#395).
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes (zizmor `artipacked`)

      # On a private repository GitHub serves dependency review only with
      # GitHub Code Security; without it the comparison the action asks for is
      # a bare 403 `{"message":"Forbidden"}` (recorded 2026-10-04 on a Pro
      # account, tests/fixtures/dependency-review-403-private.json), and the
      # action fails every pull request (#395). A disabled dependency graph
      # answers the same 403 (actions/dependency-review-action#164), and then
      # nothing else watches the dependencies either; so the graph is asked
      # too: it accepts an SBOM report request (`sbom/generate-report`, 201
      # with an `sbom_url` on the same repository; the synchronous export
      # closes on 2026-11-13). A fork's comparison is answered 403 as well
      # (GitHub's REST docs), so a fork is never refused. Both answers, on a
      # private repository that is not a fork, are reported as not checked; any other answer, an error or a public repository runs the
      # review as before, so it still fails.
      - name: Is dependency review served on this repository?
        id: served
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PRIVATE: ${{ github.event.repository.private }}
          FORK: ${{ github.event.repository.fork }}   # the comparison answers a fork 403 too
          API: ${{ github.api_url }}
        run: |
          set -uo pipefail
          body="$RUNNER_TEMP/dependency-compare.json"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/repos/$REPO/dependency-graph/compare/$BASE...$HEAD" 2>/dev/null)" || code=000
          message="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("message",""))' "$body" 2>/dev/null || true)"
          graph=no
          if [ "$PRIVATE" = "true" ] && [ "$FORK" = "false" ] && [ "$code" = 403 ] && [ "$message" = "Forbidden" ]; then
            sbom="$RUNNER_TEMP/dependency-sbom.json"
            sbom_code="$(curl -sS -o "$sbom" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/repos/$REPO/dependency-graph/sbom/generate-report" 2>/dev/null)" || sbom_code=000
            if [ "$sbom_code" = 201 ] && python3 -c 'import json,sys; sys.exit(0 if str(json.load(open(sys.argv[1])).get("sbom_url","")).startswith("http") else 1)' "$sbom" 2>/dev/null; then
              graph=yes
            else
              echo "dependency review: 403 Forbidden, and the dependency graph did not answer (HTTP $sbom_code): is it enabled in Settings? Running the review."
            fi
          fi
          if [ "$graph" = yes ]; then
            echo "review=refused" >> "$GITHUB_OUTPUT"
            echo "GitHub refuses dependency review on this private repository (HTTP 403 Forbidden) while its dependency graph answers: it needs GitHub Code Security."
          else
            echo "review=run" >> "$GITHUB_OUTPUT"
            echo "dependency review: GitHub answered HTTP $code; running it."
          fi

      - name: Dependency review, blocks vulnerable versions a PR introduces
        id: review
        if: github.event_name == 'pull_request' && steps.served.outputs.review != 'refused'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.deps-fail-on-severity }}
          comment-summary-in-pr: on-failure
          # No `deny-licenses` here: outbound licences differ per project and a
          # wrong list blocks legitimate dependencies. A project sets it in its
          # own call if it needs one.

      # Not a PR: report a pass instead of skipping the job (see pr-title).
      # Refused (#395): not yet confirmed. A head Dependabot pushed is not
      # analysed by CodeQL, whose code_scanning rule then passes (#179): said
      # here, read from who started the run, since CodeQL's own check cannot.
      - name: Verdict
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          SERVED: ${{ steps.served.outputs.review }}
          REVIEW: ${{ steps.review.outcome }}
          SEVERITY: ${{ inputs.deps-fail-on-severity }}
          ACTOR: ${{ github.actor }}
        run: |
          nw=0; trap '[ "$nw" -le 9 ] || echo "::warning::$((nw - 9)) more not yet confirmed lines are in the job summary"' EXIT
          say() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; case "$1" in *"; left to /plinth:floor-check") ;; "not yet confirmed: "*) nw=$((nw + 1)); if [ "$nw" -le 9 ]; then w="${1//'%'/%25}"; w="${w//$'\r'/%0D}"; echo "::warning::${w//$'\n'/%0A}"; fi ;; esac; }
          if [ "$EVENT" = pull_request_review ]; then
            say "pass: dependency review, does not apply (a review started this run: the pull_request run of this head compares its dependencies, and that run's result stands)"
          elif [ "$EVENT" != pull_request ]; then
            say "pass: dependency review, does not apply (not a pull request: no base to compare dependencies against)"
          elif [ "$SERVED" = refused ]; then
            say "not yet confirmed: dependency review, GitHub refuses it on this private repository without GitHub Code Security (HTTP 403), so no dependency this pull request adds was compared with the advisory database; Dependabot alerts report one after the merge"
          elif [ "$REVIEW" = success ]; then
            say "pass: dependency review, no added dependency version with an advisory at $SEVERITY or above"
          elif [ "$REVIEW" = failure ]; then
            say "fail: dependency review, an added dependency version has an advisory at $SEVERITY or above, or the review could not run"
          else
            say "not yet confirmed: dependency review, it did not run because an earlier step failed; a run that gets past that step confirms it"
          fi
          if [ "$EVENT" = pull_request ] && [ "$ACTOR" = "dependabot[bot]" ]; then
            say "not yet confirmed: CodeQL on this head, Dependabot pushed it and CodeQL does not analyse a head Dependabot pushed; \`main\` is analysed after the merge"
          fi

  # Diff size is a reviewability gate, not a correctness one: can a person
  # read this? A rule that lives only in an issue body never fires; a 400-line
  # limit written in prose was exceeded by 436 lines and nothing stopped it.
  #
  # Why now (measured 2026): AI-assisted PRs are 2.6x the size of human ones
  # (p75 408 vs 157 lines) and agent-opened PRs wait 5.3x longer for a
  # reviewer. What predicts review effort is diff size, not the PR text
  # (arXiv 2601.00753: body text AUC 0.57, no signal).
  #
  # The meter matters as much as the rule: the same PR counted 452 lines with
  # everything and 385 without docs and lockfiles. The rule was right; the
  # meter was wrong. Hence the default exclusions.
  diff-size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The approval asked for below reads the reviews and the head's pusher
    # and re-runs a red run. A called workflow's top-level permissions cap
    # what its caller grants, so they are asked for here; a caller whose
    # `ci` job does not grant them fails at startup, every job with it (#586).
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # base...head needs both histories
          persist-credentials: false   # nothing here pushes (zizmor `artipacked`)

      - name: Measure the reviewable diff
        env:
          MAX_LINES: ${{ inputs.max-diff-lines }}
          EXCLUDE: ${{ inputs.diff-size-exclude }}
          WORKDIR: ${{ inputs.working-directory }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          nw=0; trap '[ "$nw" -le 9 ] || echo "::warning::$((nw - 9)) more not yet confirmed lines are in the job summary"' EXIT
          say() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; case "$1" in *"; left to /plinth:floor-check") ;; "not yet confirmed: "*) nw=$((nw + 1)); if [ "$nw" -le 9 ]; then w="${1//'%'/%25}"; w="${w//$'\r'/%0D}"; echo "::warning::${w//$'\n'/%0A}"; fi ;; esac; }

          # Not a PR: report a pass instead of skipping the job. The condition
          # lives inside the step, not on the job, so the check name always
          # reports (see pr-title).
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "Not a pull request: no diff to measure."
            say "pass: diff size, does not apply (not a pull request: no diff to measure)"
            exit 0
          fi

          root="${WORKDIR%/}"
          if [ -z "$root" ] || [ "$root" = "." ]; then
            prefix=""
            spec=(".")
          else
            prefix="$root/"
            spec=("$root")
          fi

          patterns=()
          if [ -n "$EXCLUDE" ]; then
            read -r -a patterns <<< "$EXCLUDE"
          fi
          for p in ${patterns+"${patterns[@]}"}; do
            spec+=(":(exclude)${prefix}${p}")
          done

          # Three dots (base...head): changes since the merge base, which is
          # what GitHub shows on the PR.
          if ! numstat="$(git diff --numstat "${BASE_SHA}...${HEAD_SHA}" -- "${spec[@]}")"; then
            echo "::error::Could not compute the diff (base=${BASE_SHA} head=${HEAD_SHA})."
            say "fail: diff size, the diff could not be computed"
            exit 1
          fi

          added=0
          removed=0
          while read -r a d _; do
            if [ -z "$a" ] || [ "$a" = "-" ]; then   # blank line or binary
              continue
            fi
            added=$((added + a))
            removed=$((removed + d))
          done <<< "$numstat"
          total=$((added + removed))

          if [ "$MAX_LINES" -le 0 ]; then
            say "pass: diff size, measured and not enforced (max-diff-lines is 0): ${total} lines"
          elif [ "$total" -gt "$MAX_LINES" ]; then
            say "fail: diff size, ${total} lines, over the limit of ${MAX_LINES}"
          else
            say "pass: diff size, ${total} lines, within the limit of ${MAX_LINES}"
          fi
          {
            echo
            echo "### Diff size"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Reviewable change | **${total} lines** (+${added} / -${removed}) |"
            echo "| Limit | ${MAX_LINES} lines |"
            echo "| Excluded from the count | \`${EXCLUDE}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MAX_LINES" -le 0 ]; then
            echo "Limit is 0: measured, not enforced: ${total} lines"
            exit 0
          fi

          if [ "$total" -gt "$MAX_LINES" ]; then
            echo "::error::Reviewable diff is ${total} lines (limit ${MAX_LINES}). Split it."
            {
              echo
              echo "**Over the limit.** Docs and lockfiles are already excluded from this number."
              echo
              echo "How to split: cut the change along its dependency chain into a stack"
              echo "(data, then API, then wiring, then UX). Each layer can have a different reviewer."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "OK: ${total} lines / limit ${MAX_LINES}"

      # An agent that cannot make a check pass can make it weaker: delete a
      # test, loosen a threshold, edit the workflow, rewrite a test inside a
      # kept file, skip a test or silence a line (#301, #434). This step
      # names each such change the description does not, as a WARN: it never fails
      # the check. Why not FAIL: the description is read from the event, and
      # an edited description does not re-run CI (#322), so the only fix a
      # FAIL could accept is a push; and "the description names the path" is
      # a text match, which would block every consumer on a wording miss.
      # A kept Python test file is listed when it loses a line, and a Python
      # file when an added line carries a skip, xfail, noqa, type: ignore or
      # pragma: no cover marker. What it cannot see: an assertion weakened
      # with no line removed (a line only added, such as an early return), a
      # marker spelled another way, a threshold passed as a workflow input by
      # the caller. Nor can it say whether a listed change lowers the
      # standard: a rewrite someone agreed to looks the same. It makes a
      # change visible; whether the change is justified is the reviewer's call.
      - name: Name changes to the checks the description does not
        if: ${{ !cancelled() }}
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
          CHANGES_FILE: ${{ runner.temp }}/changes-to-the-checks.json
          WEB: ${{ inputs.web }}
        run: |
          import json, os, re, subprocess, sys

          base, head = os.environ.get("BASE_SHA", ""), os.environ.get("HEAD_SHA", "")
          body = os.environ.get("BODY") or ""
          summary = os.environ.get("GITHUB_STEP_SUMMARY") or os.devnull

          def emit(*lines):
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")

          if not base or not head:
              print("Not a pull request: no description to compare.")
              emit("### Changes to the checks: not a pull request, nothing compared")
              sys.exit(0)

          def git(*args):
              r = subprocess.run(["git", *args], capture_output=True)
              if r.returncode != 0:
                  err = r.stderr.decode("utf-8", "replace").strip().replace("\n", " ")
                  print(f"::error::git {args[0]} failed (base={base} head={head}): {err}")
                  sys.exit(1)
              return r.stdout.decode("utf-8", "surrogateescape")

          TEST = re.compile(r"(^|/)tests?/|(^|/)test_[^/]*\.py$|_test\.py$")
          # By the tool each name configures. pytest's are the files its
          # locator reads (pyproject.toml is compared by its [tool.*] tables
          # below): src/_pytest/config/findpaths.py at pytest 9.1.1,
          # cf470ec0bf7eb89cd97dd56df4859eae5db46447.
          CONFIG = {
              "conftest.py", "pytest.toml", ".pytest.toml",                # pytest
              "pytest.ini", ".pytest.ini",                                 # pytest
              "tox.ini", "setup.cfg",                                      # pytest, others
              "mypy.ini", ".mypy.ini",                                     # mypy
              "ruff.toml", ".ruff.toml",                                   # ruff
              ".coveragerc",                                               # coverage
              ".pre-commit-config.yaml",                                   # pre-commit
              ".gitleaks.toml", ".gitleaksignore",                         # gitleaks
              "ruleset.json",                                              # the ruleset
          }
          mb = git("merge-base", base, head).strip()

          # A parser, not a line scan: a multiline string can hold a line that
          # looks like a header, and TOML spells `[tool.x]` several ways.
          try:
              import tomllib
          except ImportError:   # Python < 3.11: no parser, so any edit counts
              tomllib = None

          def tool_table(rev, path):
              """pyproject.toml's `tool` table at rev; None when the file is
              absent; its whole text when it cannot be parsed."""
              r = subprocess.run(["git", "show", f"{rev}:{path}"], capture_output=True)
              if r.returncode != 0:
                  return None
              text = r.stdout.decode("utf-8", "replace")
              if tomllib is None:
                  return text
              try:
                  return tomllib.loads(text).get("tool")
              except tomllib.TOMLDecodeError:
                  return text

          def archetype(rev, path):
              """The archetype: line of .copier-answers.yml at rev; None when
              the file is absent, "" when it has no such line."""
              r = subprocess.run(["git", "show", f"{rev}:{path}"], capture_output=True)
              if r.returncode != 0:
                  return None
              m = re.search(r"^archetype:(.*)$", r.stdout.decode("utf-8", "replace"), re.MULTILINE)
              return m.group(1).strip() if m else ""

          # The web archetype's own kinds (#615), as plinth-template renders
          # it, read with the `web` input: who may reach a route, the
          # migrations already written, and how production runs. An added
          # migration is not listed; `ci / migrations` checks it.
          WEB = os.environ.get("WEB") == "true"
          ANSWERS = ".copier-answers.yml"
          ACCESS = re.compile(r"(^|/)notes/access\.py$")

          def web_what(status, old, new):
              name = new.rsplit("/", 1)[-1]
              # ci / floor-check reads its archetype-conditional items from this
              # line, in the file at this path: a deletion or a move is listed
              # whatever the content.
              if ANSWERS in (name, old.rsplit("/", 1)[-1]) and (status in ("D", "R") or (
                      archetype(mb, old) if old.rsplit("/", 1)[-1] == ANSWERS else None) != (
                      archetype(head, new) if name == ANSWERS else None)):
                  return f"the archetype: line of {ANSWERS} changed, or the file deleted or moved"
              if not WEB:
                  return None
              if ACCESS.search(old) or ACCESS.search(new):
                  return "notes/access.py changed (it defines which routes are public)"
              if status != "A" and re.search(r"(^|/)migrations/", old):
                  return "an existing migration changed, deleted or renamed"
              if re.search(r"(^|/)src/[^/]+/settings\.py$", old) or re.search(r"(^|/)src/[^/]+/settings\.py$", new):
                  return "the production settings module changed"
              if {"render.yaml", "Dockerfile"} & {name, old.rsplit("/", 1)[-1]}:
                  return "how production runs changed (render.yaml or the Dockerfile)"
              if re.search(r"(^|/)tests/migration_rows\.json$", old) or re.search(r"(^|/)tests/migration_rows\.json$", new):
                  return "the rows ci / migrations keeps changed (tests/migration_rows.json)"
              return None

          # The agent's own rules (#651): what it reads as instructions, what
          # it may run, and the skills and output style it is given. By the
          # path at the repository root, on either side of a move.
          AGENT = (("AGENTS.md", "the agent's instructions (AGENTS.md)"),
                   ("CLAUDE.md", "the agent's instructions (CLAUDE.md)"),
                   (".claude/settings.json", "the agent's permissions and hooks (.claude/settings.json)"),
                   (".claude/skills/", "an agent skill (.claude/skills/)"),
                   (".claude/output-styles/", "the agent's output style (.claude/output-styles/)"))

          def agent_what(old, new):
              for p, why in AGENT:
                  if any(x == p or (p.endswith("/") and x.startswith(p)) for x in (old, new)):
                      return f"{why} added, changed, deleted or moved"
              return None

          def what(status, old, new):
              """Why this path touches the checks, or None."""
              name = new.rsplit("/", 1)[-1]
              if new.startswith(".github/workflows/") or old.startswith(".github/workflows/"):
                  return "a workflow changed"
              agent = agent_what(old, new)
              if agent:
                  return agent
              web = web_what(status, old, new)
              if web:
                  return web
              if name in CONFIG or old.rsplit("/", 1)[-1] in CONFIG:
                  return "check configuration changed"
              if status == "D" and TEST.search(old):
                  return "a test file deleted"
              if status == "R" and TEST.search(old) and not TEST.search(new):
                  return "a test file moved out of the test paths"
              was = old.rsplit("/", 1)[-1] == "pyproject.toml"
              if (was or name == "pyproject.toml") and (
                      (tool_table(mb, old) if was else None)
                      != (tool_table(head, new) if name == "pyproject.toml" else None)):
                  return "its [tool.*] tables changed (ruff, mypy, pytest configuration)"
              return None

          # A test rewritten inside a kept file, and a marker that turns a
          # check off for one test or one line (#434).
          MARKER = re.compile(r"\bmark\s*\.\s*(?:skipif|skip|xfail)\b|\bpytest\s*\.\s*skip\s*\("
                              r"|#\s*noqa\b|#\s*type:\s*ignore\b|#\s*pragma:\s*no\s*cover\b",
                              re.IGNORECASE)
          lost, stat = set(), git("diff", "--numstat", "-M", "-z", f"{base}...{head}").split("\0")
          i = 0
          while i < len(stat) and stat[i]:
              _, d, path = stat[i].split("\t", 2)
              if path:                     # a rename's paths follow in the next two fields
                  new, i = path, i + 1
              else:
                  new, i = stat[i + 2], i + 3
              if d not in ("-", "0"):
                  lost.add(new)

          def markers(status, old, new):
              """The markers on lines this pull request adds to a Python file."""
              if status not in ("A", "M", "R") or not new.endswith(".py"):
                  return []
              out, hunk = [], False
              for line in git("diff", "-U0", "-M", "--no-color", "--no-ext-diff", "--no-textconv",
                              f"{base}...{head}", "--",
                              f":(literal){old}", f":(literal){new}").split("\n"):
                  hunk = hunk or line.startswith("@@")
                  if hunk and line.startswith("+"):
                      out += [m.group(0) for m in MARKER.finditer(line)]
              return sorted(set(out))

          def shape(status, old, new):
              whys = []
              if status in ("M", "R") and new.endswith(".py") and TEST.search(old) \
                      and TEST.search(new) and new in lost:
                  whys.append("a test file lost lines")
              found = markers(status, old, new)
              if found:
                  whys.append("a skip or a suppression added (" + ", ".join(found) + ")")
              return whys

          # What marks a route public: notes/access.py's `public`, or Django's
          # own login_not_required that it wraps. Any added line naming either,
          # a comment line aside, since a decorator, a call, an alias or a
          # lookup by string all reach it (the codex review of #624). Apart
          # from markers and shape, which gitlab/python-ci.yml shares word for
          # word: the web archetype is GitHub only.
          # A name the head already binds to either is read too, so a route
          # opened through an alias the base carries is listed (round 2 of
          # that review): an import's `as`, an assignment, a getattr by
          # string, followed through further assignments. A function that
          # wraps one is not followed.
          def public_names():
              names = {"public", "login_not_required"}
              r = subprocess.run(["git", "grep", "-h", "-I", "-E", r"[[:space:]]as[[:space:]]|=", head, "--", "*.py"],
                                 capture_output=True)
              if r.returncode not in (0, 1):   # 1 is no match; anything else is not an answer
                  print(f"::error::git grep failed at {head}: {r.stderr.decode('utf-8', 'replace').strip()}")
                  sys.exit(1)
              lines = r.stdout.decode("utf-8", "replace").split("\n")
              while True:
                  alt = "|".join(sorted(map(re.escape, names)))
                  found = set()
                  for line in lines:
                      found |= set(re.findall(rf"\b(?:{alt})\s+as\s+(\w+)", line))
                      found |= set(re.findall(rf"^\s*(\w+)\s*(?::[^=]*)?=\s*(?:[\w.]+\.)?(?:{alt})\s*(?:#.*)?$", line))
                      found |= set(re.findall(rf"^\s*(\w+)\s*=\s*getattr\([^)]*['\"](?:{alt})['\"]", line))
                  if found <= names:
                      return names
                  names |= found

          PUBLIC = re.compile(r"\b(?:" + "|".join(sorted(map(re.escape, public_names()))) + r")\b") if WEB else None

          def routes(status, old, new):
              """A route marked public on a line this pull request adds to a
              Python file outside the tests and notes/access.py."""
              if not WEB or status not in ("A", "M", "R") or not new.endswith(".py") \
                      or TEST.search(new) or ACCESS.search(new):
                  return []
              hunk, seen = False, set()
              for line in git("diff", "-U0", "-M", "--no-color", "--no-ext-diff", "--no-textconv",
                              f"{base}...{head}", "--",
                              f":(literal){old}", f":(literal){new}").split("\n"):
                  hunk = hunk or line.startswith("@@")
                  if hunk and line.startswith("+") and not line[1:].lstrip().startswith("#"):
                      seen |= {m.group(0) for m in PUBLIC.finditer(line[1:])}
              if not seen:
                  return []
              return [f"a line naming {', '.join(sorted(seen))} added or changed "
                      "(public, login_not_required or an alias of one: it can mark a route public)"]

          fields = git("diff", "--name-status", "-M", "-z", f"{base}...{head}").split("\0")
          found, i = [], 0
          while i < len(fields) and fields[i]:
              status = fields[i][0]
              if status == "R":
                  old, new, i = fields[i + 1], fields[i + 2], i + 3
              else:
                  old = new = fields[i + 1]
                  i += 2
              whys = [w for w in [what(status, old, new)] if w] + shape(status, old, new) + routes(status, old, new)
              if whys:
                  found.append((new if status != "D" else old, old, "; ".join(whys),
                                [w for w in whys if w != "a workflow changed"]))

          # What may stand next to a name that is not part of it: whitespace
          # and Markdown punctuation, typographic quotes included. Any other
          # character (`-`, `.`, `~`, `\`, a letter) makes a longer name, which
          # names nothing.
          EDGE = r"\s`'\"()\[\]{}<>*,;:!?\u2018\u2019\u201c\u201d"
          # A run of `_` or `~` counts only with a run on each side of the
          # name, as emphasis or strikethrough has: `_ci.yml_`, `~~ci.yml~~`
          # (#334). One side alone (`ci.yml~`, `my_ci.yml`) is a longer name.
          WRAP = "[_~]+"

          def named(path, old):
              """A path or file name standing whole in the body, with an EDGE
              character or the start or end on each side; a full stop may end
              it. So `python-ci.yml` does not name `ci.yml`. A `/` may also come
              before a path (a link to the file) but not before a bare name:
              `docs/ci.yml` does not name `.github/workflows/ci.yml`. A link
              target's `#fragment` is dropped first: inline (`[x](ci.yml#L3)`),
              a reference definition (`[x]: ci.yml#L3`) or an autolink, which
              has a scheme (`<https://…/ci.yml#L3>`; `<ci.yml#2>` is not one)."""
              text = re.sub(r"(\]\([^()\s#]*)#[^()\s]*", r"\1", body)
              text = re.sub(r"(?m)^( {0,3}\[[^\]]+\]:[ \t]*<?[^\s<>#]*)#[^\s<>]*", r"\1", text)
              text = re.sub(r"(<[A-Za-z][A-Za-z0-9+.-]{1,31}:[^<>\s#]*)#[^<>\s]*(?=>)", r"\1", text)
              def whole(p):
                  before = "(?<![^" + EDGE + ("/" if "/" in p else "") + "])"
                  after = r"(?=\Z|[" + EDGE + r"]|\.(?:\Z|[" + EDGE + "]))"
                  before_run = "(?<![^" + EDGE + "])"
                  return re.search(before + re.escape(p) + after, text) \
                      or re.search(before_run + WRAP + re.escape(p) + WRAP + after, text)
              return any(whole(p) for p in {path, old, path.rsplit("/", 1)[-1], old.rsplit("/", 1)[-1]})

          def command_safe(s):   # a path must not end the warning and start another command
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def cell(s):
              return "`" + s.replace("`", "'").replace("|", "\\|").replace("\n", " ") + "`"

          # The kinds besides a workflow, for the next step to ask an
          # admin's approval of; the workflow kind stays a WARN.
          if os.environ.get("CHANGES_FILE"):
              with open(os.environ["CHANGES_FILE"], "w", encoding="utf-8") as f:
                  json.dump([{"path": p, "why": "; ".join(k)} for p, _, _, k in found if k], f)

          rows, unnamed = [], 0
          for path, old, why, _ in found:
              label = path if path == old else f"{old} -> {path}"
              if named(path, old):
                  print(f"named in the description: {label}: {why}")
                  rows.append(f"| {cell(label)} | {why} | named |")
              else:
                  unnamed += 1
                  print(command_safe(f"::warning::{label}: {why}, and the description does not name it."))
                  rows.append(f"| {cell(label)} | {why} | **not named** |")

          print(f"{len(found)} change(s) to the checks, {unnamed} not named in the description.")
          if found:
              emit("", "### Changes to the checks", "",
                   "| Path | Change | Description |", "|---|---|---|", *rows)
          if unnamed:
              emit("", "Not naming a path is a WARN, not a failure. Name each path in the description and say why;",
                   "the description is read when the run starts, so push to re-check it.")

      # The listed changes, a workflow aside, need the person's approval
      # where the agent works under an account of its own (#518, #586). The
      # mark is an admin's approving review on this head: Write can add a
      # label, and a label stays across pushes. The account that pushed the
      # head is read from the branch's activity, not the commit's author,
      # which anyone writes. Pushed by an admin (one account for the person
      # and the agent, who then cannot approve their own pull request): it
      # stays green and says the change is the person's decision. Pushed by
      # Dependabot, by its account id: the same. From a fork: no push is read
      # (the activity is the fork's), so it needs the approval. Whatever this
      # step cannot read fails, since it runs only where a change is listed.
      # A run started by the approval re-runs the latest pull_request run of
      # this head when that one failed, because the latest run of each event
      # decides the merge (measured, not documented: #518). A fork's
      # read-only token cannot, and the line says how a person does it.
      - name: Ask an admin to approve a change to the checks
        if: ${{ !cancelled() }}
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CHANGES_FILE: ${{ runner.temp }}/changes-to-the-checks.json
        run: |
          import json, os, subprocess, sys
          from urllib.parse import quote

          E = os.environ.get
          repo, number, head, event = E("REPO", ""), E("NUMBER", ""), E("HEAD_SHA", ""), E("EVENT", "")
          summary = E("GITHUB_STEP_SUMMARY") or os.devnull
          DEPENDABOT = 49699333   # dependabot[bot]'s account id; a login can be spelled alike
          WAY = ("If you agree with the change, approve the pull request on GitHub: Files changed, "
                 "Review changes, Approve. The approval re-runs the latest red run; if this check "
                 "does not turn green, use \"Re-run failed jobs\" on the latest red ci / diff-size.")

          def emit(*lines):
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")

          def say(line):
              emit(f"- {line}")
              kind = {"fail": "error", "not yet confirmed": "warning"}.get(line.split(":", 1)[0])
              if kind:
                  print(f"::{kind}::" + line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
              else:
                  print(line)

          class Unread(Exception):
              pass

          def api(path, *args):
              r = subprocess.run(["gh", "api", *args, path], capture_output=True, text=True)
              if r.returncode != 0:
                  err = (r.stderr.strip().splitlines() or ["no answer"])[-1]
                  raise Unread(f"{path.split('?', 1)[0]}: {err}")
              return r.stdout

          def permission(login):
              try:
                  return json.loads(api(f"repos/{repo}/collaborators/{quote(login)}/permission"))["permission"]
              except Unread as e:
                  if "HTTP 404" in str(e):   # an app's bot account is no collaborator
                      return "none"
                  raise

          if not head or not number:
              sys.exit(0)   # not a pull request: the step above said so
          try:
              with open(E("CHANGES_FILE", ""), encoding="utf-8") as f:
                  listed = json.load(f)
          except (OSError, ValueError):
              say("fail: changes to the checks, the step that lists them did not finish, so whether "
                  "this pull request needs an admin's approval is unknown; re-running the job may clear it")
              sys.exit(1)
          if not listed:
              sys.exit(0)

          sha = head[:12]
          rows = "; ".join(f"{r['path']}: {r['why']}" for r in listed[:5]) + (
              f"; and {len(listed) - 5} more in the table above" if len(listed) > 5 else "")
          try:
              if E("HEAD_REPO", "") != repo:
                  why = "it comes from a fork"
              else:
                  ref = quote(f"refs/heads/{E('HEAD_REF', '')}", safe="/")
                  pushes = json.loads(api(f"repos/{repo}/activity?ref={ref}&direction=desc&per_page=100"))
                  actor = next((p.get("actor") for p in pushes if p.get("after") == head), None)
                  if not actor or not actor.get("login"):
                      raise Unread("no push of this head in the branch's activity")
                  why = f"{actor['login']} pushed it and is not an admin"
                  if actor.get("id") == DEPENDABOT:
                      say(f"not yet confirmed: changes to the checks, Dependabot pushed this head ({sha}), "
                          "so no approval is asked; the change in the table above lowers or changes the "
                          "checks and is the person's decision; reading the table before merging confirms it")
                      sys.exit(0)
                  if permission(actor["login"]) == "admin":
                      say(f"not yet confirmed: changes to the checks, {actor['login']}, an admin, pushed this "
                          f"head ({sha}), so no approval is asked; the change in the table above lowers or "
                          "changes the checks and is the person's decision; reading the table before "
                          "merging confirms it")
                      sys.exit(0)
              reviews = [json.loads(l) for l in api(f"repos/{repo}/pulls/{number}/reviews",
                                                     "--paginate", "--jq", ".[] | tojson").splitlines() if l.strip()]
              latest = {}   # each reviewer's last decision; a comment decides nothing
              for r in sorted(reviews, key=lambda r: r.get("id") or 0):
                  if r.get("state") in ("APPROVED", "CHANGES_REQUESTED", "DISMISSED") and r.get("user"):
                      latest[r["user"]["login"]] = r
              approver = next((login for login, r in sorted(latest.items())
                               if r["state"] == "APPROVED" and r.get("commit_id") == head
                               and permission(login) == "admin"), None)
          except Unread as e:
              say(f"fail: changes to the checks, this pull request changes how strict the checks are and "
                  f"what decides whether it needs an admin's approval could not be read ({e}); "
                  "re-running the job may clear it")
              sys.exit(1)

          if not approver:
              say(f"fail: changes to the checks, this pull request changes how strict the checks are "
                  f"({rows}) and {why}, so it needs an admin's approval on this head ({sha}); "
                  f"it has none. {WAY}")
              sys.exit(1)
          say(f"pass: changes to the checks, approved by {approver}, an admin, on this head ({sha})")
          if event != "pull_request_review":
              sys.exit(0)

          # The approval's own run: the latest pull_request run of this head
          # still decides, so re-run it when it failed, and nothing else.
          def way(reason):
              print(f"::notice::The approval could not re-run the latest red run ({reason}). "
                    "Use \"Re-run failed jobs\" on the latest red ci / diff-size.")
              emit("", f"The approval could not re-run the latest red run ({reason}). "
                   "Use \"Re-run failed jobs\" on the latest red ci / diff-size.")
          try:
              workflow = json.loads(api(f"repos/{repo}/actions/runs/{E('RUN_ID', '')}"))["workflow_id"]
              runs = json.loads(api(f"repos/{repo}/actions/workflows/{workflow}/runs"
                                    f"?head_sha={head}&event=pull_request&per_page=100"))["workflow_runs"]
          except (Unread, KeyError, TypeError) as e:
              way(f"the runs of this head could not be read: {e}")
              sys.exit(0)
          last = max(runs, key=lambda r: (r.get("created_at") or "", r.get("id") or 0), default=None)
          if last is None:
              print("No pull_request run of this head to re-run.")
          elif last.get("status") != "completed":
              # Its diff-size may already be red while other jobs run, and a
              # run is re-run only once it has finished.
              way(f"the latest pull_request run of this head ({last.get('id')}) was still running; "
                  "once it finishes, if its ci / diff-size is red")
          elif last.get("conclusion") in ("failure", "cancelled", "timed_out"):
              try:
                  api(f"repos/{repo}/actions/runs/{last['id']}/rerun-failed-jobs", "-X", "POST")
                  print(f"Re-ran the failed jobs of the latest pull_request run of this head ({last['id']}).")
                  emit("", f"The approval re-ran the failed jobs of the latest red run of this head ({last['id']}).")
              except Unread as e:
                  way(str(e))
          else:
              print(f"The latest pull_request run of this head ({last.get('id')}) is {last.get('conclusion')}; nothing to re-run.")

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes (zizmor `artipacked`)
      - name: Install uv (official release, SHA256 verified)
        env:
          UV_VERSION: "0.12.9"
          UV_SHA256: "ec7a99cd05e0cd7f80243f135ce1361c76835cb0ee60055d14d20eba8eba1460"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/uv"; mkdir -p "$d"
          f="uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$d/$f" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/$f"
          echo "${UV_SHA256}  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" --strip-components=1 "${f%.tar.gz}/uv" "${f%.tar.gz}/uvx"
          echo "$d" >> "$GITHUB_PATH"
      - id: sync
        run: uv sync --locked
      - id: build
        run: uv build

      # `uv build` proves the files were produced. Whether they install and
      # import in a clean environment is a different sentence: missing package
      # data, a wrong package name, broken metadata only show up here.
      - name: Install smoke, wheel and sdist into a clean venv
        id: smoke
        run: |
          set -euo pipefail
          name="$(uv run python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["name"])')"
          for art in dist/*.whl dist/*.tar.gz; do
            rm -rf .smoke
            uv venv --quiet .smoke
            uv pip install --quiet --python .smoke/bin/python "$art"
            .smoke/bin/python -c 'import importlib.metadata as md,sys; print(sys.argv[1], md.version(sys.argv[1]))' "$name"
            if [ -d src ]; then
              for m in src/*/; do
                m="$(basename "$m")"
                .smoke/bin/python -c 'import importlib,sys; importlib.import_module(sys.argv[1])' "$m"
                echo "  import $m ok"
              done
            fi
            echo "  OK $art"
          done

      - name: Verdict
        if: ${{ !cancelled() }}
        env:
          SYNC: ${{ steps.sync.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          nw=0; trap '[ "$nw" -le 9 ] || echo "::warning::$((nw - 9)) more not yet confirmed lines are in the job summary"' EXIT
          say() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; case "$1" in *"; left to /plinth:floor-check") ;; "not yet confirmed: "*) nw=$((nw + 1)); if [ "$nw" -le 9 ]; then w="${1//'%'/%25}"; w="${w//$'\r'/%0D}"; echo "::warning::${w//$'\n'/%0A}"; fi ;; esac; }
          v() { case "$1" in success) say "pass: $2" ;; failure) say "fail: $2" ;; *) say "not yet confirmed: $2, it did not run because an earlier step failed; a run that gets past that step confirms it" ;; esac; }
          v "$SYNC" "uv sync --locked"
          v "$BUILD" "uv build"
          v "$SMOKE" "install smoke, the wheel and the sdist in a clean venv"

  # The floor: does this repository still have what /plinth:new-project gave
  # it, and does its wall still stand? The same checker the floor-check skill
  # runs read-only, fetched from plinth at the commit this workflow file comes
  # from (`job.workflow_sha`). Token, network and inputs can still make the
  # two results differ, and the checker counts what it could not read as
  # `not verified`. One blind spot: bypass actors are visible only to an
  # admin-read token, which the Actions token never is; CI reports SKIP there
  # and the skill sees them. Push protection is behind the same token: with
  # --actions-token the checker says so in an INFO, not a SKIP, and judges it
  # wherever the token does read it (#303). A private repository's missing
  # CodeQL rule is behind it too: a defect only with GitHub Code Security,
  # which this token does not read, so an INFO names the skill as its judge (#351).
  floor-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Labels belong to issues: without this the label check reads an API
      # error and reports "not verified" in every consumer's CI, so the one
      # place it matters most is the one place it would never run (#84).
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes (zizmor `artipacked`)

      # `job.workflow_sha` is documented (contexts reference, job context) but
      # actionlint's schema does not know it yet; lint with
      # -ignore 'property "workflow_sha" is not defined'.
      - name: Fetch the checker from the same plinth commit as this workflow
        env:
          PLINTH_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/plinth"; mkdir -p "$d"
          for f in scripts/floor-check.py ruleset.json ruleset-merge.json labels.txt scripts/new-project.sh; do
            curl -fsSL --retry 3 -o "$d/$(basename "$f")" \
              "https://raw.githubusercontent.com/coolbress/plinth/${PLINTH_SHA}/$f"
          done
          echo "plinth ${PLINTH_SHA}"

      - name: Floor check
        env:
          GH_TOKEN: ${{ github.token }}
          WORKDIR: ${{ inputs.working-directory }}
          EXPECT: ${{ inputs.floor-check-required-checks }}
        # The verdict lines first, then the report; the exit code is the
        # checker's. A checker that wrote no verdict file (a crash) is a fail.
        run: |
          set -euo pipefail
          nw=0; trap '[ "$nw" -le 9 ] || echo "::warning::$((nw - 9)) more not yet confirmed lines are in the job summary"' EXIT
          say() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; case "$1" in *"; left to /plinth:floor-check") ;; "not yet confirmed: "*) nw=$((nw + 1)); if [ "$nw" -le 9 ]; then w="${1//'%'/%25}"; w="${w//$'\r'/%0D}"; echo "::warning::${w//$'\n'/%0A}"; fi ;; esac; }
          t="$RUNNER_TEMP/floor"; rc=0
          python3 "$RUNNER_TEMP/plinth/floor-check.py" \
            --root . --project "$WORKDIR" --repo "$GITHUB_REPOSITORY" \
            --ruleset "$RUNNER_TEMP/plinth/ruleset.json" --merge-ruleset "$RUNNER_TEMP/plinth/ruleset-merge.json" \
            --caller-from-checkout --actions-token \
            ${EXPECT:+--expect-checks "$EXPECT"} --verdicts "$t.verdicts" > "$t.txt" || rc=$?
          cat "$t.txt"
          if [ ! -f "$t.verdicts" ]; then
            echo "fail: the floor, the checker wrote no verdicts (exit $rc); its report is below" > "$t.verdicts"
            [ "$rc" != 0 ] || rc=1
          fi
          while IFS= read -r l || [ -n "$l" ]; do say "$l"; done < "$t.verdicts"
          { echo; cat "$t.txt"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
