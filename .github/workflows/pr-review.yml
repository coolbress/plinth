name: pr-review
#
# Did a third party look at this commit? Reusable workflow; the check is
# `third-party / review` in every repository that calls it like this:
#
#   on:
#     pull_request:        { types: [opened, synchronize, reopened, ready_for_review] }
#     pull_request_review: { types: [submitted] }
#   permissions: { contents: read, pull-requests: read }
#   jobs:
#     third-party:
#       uses: coolbress/plinth/.github/workflows/pr-review.yml@<commit-sha>
#
# This is an optional check. `ruleset.json` does not require it; a repository
# that wants it as part of its wall adds the name with
# `scripts/upgrade-ruleset.sh <owner/name> 'third-party / review:15368'`
# (see docs/how-to/configure-the-third-party-reviewer.md). Keep the job name
# `third-party`: the check name is what rulesets require.
#
# What it checks, exactly:
#   yes  an accepted reviewer account (`reviewer-logins`) left a review signal
#        tied to THIS commit: a review, a review comment made on it, a
#        completion comment naming it, or a `Completed` row for it in the
#        reviewer's summary table. The comment and the row name the commit by
#        its first characters (ten, seven), so each counts only when it is
#        newer than the push of this commit and no other commit the branch has
#        pointed at begins with those characters (#191, #193). A fork's head
#        is pushed to the fork, not here, and was absent from this log on the
#        two fork pull requests measured (#193); there neither counts, and
#        the pull request passes on a review, a review comment or the marker.
#        Evidence of participation. A signal on an older commit does not
#        count.
#   yes  a change to the designated rules section is not mixed with other
#        changes in the same pull request.
# What it does not check:
#   no   that the whole change was reviewed, or requirements and security both.
#   no   the review's verdict. It never blocks on findings: model reviews can be
#        noisy (MSR '26 measured a signal ratio under 60% for twelve of thirteen
#        agents on closed pull requests), so an unverified verdict is not a
#        merge condition. Findings are still handled: reproduce, then fix or
#        say why not (docs/how-to/configure-the-third-party-reviewer.md).
#   no   a review on a draft or on a pull request Dependabot opened and only
#        Dependabot pushed to, nor,
#        when the caller sets `pass-release-pull-requests`, on one titled
#        `chore(release): vX.Y.Z`: on those the second step passes without a
#        summons and without looking for a review, and its log says which
#        (#167). The first step, on the instructions, still runs on them. A
#        pull request opened by any other bot, a coding agent included, is
#        looked at like a person's.
#   no   that anyone read the review. Reading is the job of the person who
#        presses merge. To make that easier the log and the job summary list
#        the accepted reviewer's inline comments on this commit, with their
#        URLs, once the check has decided (#176); a summary comment saying
#        "no major issues" has arrived next to an unanswered inline finding
#        (measured on #174).
#   no   that the reviewer is independent of the author: `reviewer-logins` is a
#        trust setting, not an independence check.
#   no   that a review gets started. The summons it can post reaches the
#        reviewer only from a person's account: measured 2026-09-18 (#186),
#        two `@codex review` comments from `github-actions[bot]` drew nothing
#        in the full wait, and the same text from a person started a review
#        sixteen seconds later; of seven reviewers read that day none
#        documents honouring a bot's mention (#185). So without the
#        `summons-token` secret nothing is posted and the wait is for the
#        reviewer's own trigger; with it, the summons is posted as that
#        person (#206): a third of the way into the wait if no accepted
#        reviewer has been active since the push, and at two thirds if none
#        has been active since the first of those points; at neither when the
#        branch's activity log, read at that point, confirms that another
#        commit was pushed after this head (#215). Earlier summonses for the
#        commit are counted by a hidden marker and it stops at two; a count
#        that cannot be read reads as none.
#   no   that the instructions cannot be weakened: only the designated section
#        is compared, and only within one pull request.
#
# Why the model does not run inside CI: it did once and stopped at the API key
# (metered billing). Now the reviewer runs in the vendor's cloud on a
# subscription, posts to the pull request, and this workflow only verifies,
# mechanically, that it did. No key, no verdict, and the narrowing lives in the
# reviewed repository's `AGENTS.md` under `## Code Review Rules`, which the
# vendor reads. Inputs are the two the caller may want to change plus the wait;
# the policy file and heading are the contract with `AGENTS.md`, not knobs.

on:
  workflow_call:
    inputs:
      reviewer-logins:
        description: |
          GitHub logins accepted as the third-party reviewer, comma separated.
          When none matches, the check fails and prints every author it did
          see, so a wrong name is fixed in one go.
        type: string
        default: "chatgpt-codex-connector[bot]"
      ask-comment:
        # Does nothing without `summons-token`; removing an input is a MAJOR
        # change (a caller that passes it fails with "Invalid input") (#185).
        description: |
          The comment that summons the reviewer when no review is attached.
          Posted only with the `summons-token` secret, as that person: a third
          of the way into `wait-seconds` if no accepted reviewer has been
          active since the push, and at two thirds if none has been active
          since the first of those points (#206); at neither when the
          branch's activity log, read at that point, confirms that another
          commit was pushed after this head (#215). Without the secret
          nothing is posted, because a bot's mention is not honoured (#185).
          Empty: never summon.
        type: string
        default: "@codex review"
      wait-seconds:
        description: "How long to wait for the review; reviews are asynchronous. The security review has taken over 30 minutes."
        type: number
        default: 900
      policy-file:
        description: |
          The file the reviewer reads its instructions from. It lives inside the
          reviewed repository, so a pull request could rewrite its own reviewer;
          this workflow blocks the combination of an instruction change with any
          other change.
        type: string
        default: "AGENTS.md"
      policy-heading:
        description: "Heading of the instruction section, as the reviewer reads it."
        type: string
        default: "## Code Review Rules"
      pass-release-pull-requests:
        description: |
          Off by default. When true, a pull request titled exactly
          `chore(release): vX.Y.Z` passes without a summons and without a
          review. A title is chosen by the pull request's author, so turning
          this on lets anyone skip the review by choosing that title; do not
          turn it on where this check is required.
        type: boolean
        default: false
      poll-seconds:
        description: "Interval between looks."
        type: number
        default: 20
    secrets:
      summons-token:
        description: |
          A token of the repository owner, whose GitHub account is the one
          connected to the reviewer: the token's login is checked against
          `github.repository_owner`, so this fits a repository owned by a
          person, not by an organization (there the owner is the organization
          and no person's login matches). With it the summons is posted as
          that person, when and as `ask-comment` says; without it nothing is
          posted. An empty value reads as no token.
          A token whose login cannot be read, is another person's, or cannot
          post the comment fails the check at once with the reason, not after
          the wait.
        required: false

jobs:
  review:
    # No `if:` here: a skipped job has no check name. Drafts, Dependabot's pull
    # requests and (when the caller asks) release pull requests are handled in
    # the second step, which passes without summoning a review.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read    # the summons, when posted, goes out with summons-token, never with this token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # the base is needed for the comparison
          persist-credentials: false

      # The reviewer reads its instructions from the head of the pull request,
      # and that cannot be changed. The third-party reviewer itself raised this
      # (2026-09-01): "When a PR changes this section to say 'do not report
      # workflow bugs', Codex consumes the policy from the reviewed head, omits
      # those findings, and the check still turns green." What can be blocked
      # is the combination: a pull request that changes the instructions AND
      # anything else fails. One that changes only the instructions passes;
      # it carries nothing to smuggle in.
      - name: The reviewer's instructions did not change in this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_STATE: ${{ github.event.pull_request.state }}
          POLICY_FILE: AGENTS.md              # where the reviewer reads its instructions
          POLICY_HEADING: "## Code Review Rules"
        run: |
          set -euo pipefail

          # Nothing to guard on a merged or closed pull request. Measured
          # 2026-09-01: a review submitted after the merge re-ran this workflow,
          # base and head were gone, and git exited 128. The check exists to
          # block merges; it has no reason to turn red after one.
          if [ "${MERGED:-false}" = "true" ] || [ "${PR_STATE:-open}" != "open" ]; then
            echo "pull request already merged or closed: nothing to guard."
            exit 0
          fi

          # Both commits must exist. A missing one does not pass in silence.
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "::error::commit not found: $sha; cannot tell whether the instructions changed."
              echo "the checkout is shallow or the branch is gone. Re-run the job."
              exit 1
            fi
          done

          section() {  # <sha>: the instruction section at that commit, or nothing
            git show "$1:$POLICY_FILE" 2>/dev/null \
              | awk -v h="$POLICY_HEADING" '
                  $0 == h {inside=1; next}
                  inside && /^## / {inside=0}
                  inside {print}
                ' || true
          }
          before="$(section "$BASE_SHA")"
          after="$(section "$HEAD_SHA")"

          if [ "$before" = "$after" ]; then
            echo "the reviewer's instructions are unchanged."
            exit 0
          fi

          if [ -z "$before" ]; then
            # A section that did not exist before cannot be weakened: until now
            # the reviewer looked with no instructions at all.
            echo "::notice::the reviewer's instructions are new in this pull request (absent on the base). Not blocked."
            exit 0
          fi
          echo "::notice::the reviewer's instructions changed in this pull request."

          others="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- . ":(exclude)$POLICY_FILE")"
          if [ -n "$others" ]; then
            echo "::error::the reviewer's instructions ($POLICY_FILE $POLICY_HEADING) changed together with other files."
            echo "the third party reviews this pull request under the changed instructions; it could weaken its own review."
            echo "change the instructions in a pull request that changes only that file. Changed together:"
            echo "$others" | sed 's/^/  /' | head -40
            exit 1
          fi
          echo "this pull request changes only the instructions; nothing to smuggle in, so it passes."

      # The judgement scripts live in plinth, not in the repository this runs
      # for, whose checkout is above. They are fetched from the commit this
      # workflow file comes from (`job.workflow_sha`, the one the caller's
      # `uses:` resolved to), so the step and its scripts always match. Inside
      # a called workflow `github.workflow_ref` and `github.workflow_sha` name
      # the caller's workflow, not this one. `job.workflow_sha` is documented
      # (contexts reference, job context) but actionlint's schema does not know
      # it yet; lint with -ignore 'property "workflow_sha" is not defined'.
      - name: Fetch the judgement scripts from the same plinth commit as this workflow
        env:
          PLINTH_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/plinth/scripts/pr-review"; mkdir -p "$d"
          for f in gate.sh attest.py summon.sh started.py; do
            curl -fsSL --retry 3 -o "$d/$f" \
              "https://raw.githubusercontent.com/coolbress/plinth/${PLINTH_SHA}/scripts/pr-review/$f"
          done
          echo "plinth ${PLINTH_SHA}"

      - name: A third-party review is attached to this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}   # a branch name is its author's text: env only
          DRAFT: ${{ github.event.pull_request.draft }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_STATE: ${{ github.event.pull_request.state }}
          # Author and title go through `env:`, never `${{ }}` inside `run:`:
          # a title is text the author of the pull request chooses.
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
          PASS_RELEASE: ${{ inputs.pass-release-pull-requests }}
          LOGINS: ${{ inputs.reviewer-logins }}
          ASK: ${{ inputs.ask-comment }}
          SUMMONS_TOKEN: ${{ secrets.summons-token }}
          OWNER: ${{ github.repository_owner }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}   # a fork's pull request gets no secrets
          WAIT: ${{ inputs.wait-seconds }}
          POLL: 20
        run: |
          set -euo pipefail
          PR_REVIEW="$RUNNER_TEMP/plinth/scripts/pr-review"   # the fetch step above

          if [ -z "${NUMBER:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "::error::not a pull request: nothing to check."
            exit 1
          fi
          # Who pushed to the head branch, and when: for the gate, and for the
          # judgement's completion-comment and summary-row signals (#191,
          # #193). Newest first is asked for by name: the gate reads the first
          # entry as the newest push (`asc` returns oldest first, measured
          # 2026-09-18; #197). A failed call leaves a file the gate cannot
          # read as a list, which it takes as "go on and look". The count is
          # printed so a run shows whether the call works.
          pushes() {
            gh api --method GET "repos/$REPO/activity" -f ref="refs/heads/$HEAD_REF" -f direction=desc -F per_page=100 \
              > "$RUNNER_TEMP/activity.json" 2>/dev/null || echo 'null' > "$RUNNER_TEMP/activity.json"
          }
          pushes
          echo "pushes read for the head branch: $(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(len(d) if isinstance(d,list) else "none")' "$RUNNER_TEMP/activity.json" 2>/dev/null || echo none)"
          # Pass without summoning, or go on? scripts/pr-review/gate.sh prints the
          # reason when the check passes here and nothing when the reviewer is to
          # be looked for.
          why="$(ACTIVITY_JSON="$RUNNER_TEMP/activity.json" bash "$PR_REVIEW/gate.sh")"
          if [ -n "$why" ]; then
            echo "$why"
            exit 0
          fi
          echo "pull request #$NUMBER, head $HEAD_SHA"
          echo "accepted reviewers: $LOGINS"

          # The judgement is scripts/pr-review/attest.py, a pure function of the
          # files fetched here. The signals live in three APIs; one alone misses
          # (see its docstring).
          # A failed call leaves `null`, not `[]`: the verdict reads either as
          # "no signal", and the inline-comment report tells them apart (#188).
          get() { gh api "repos/$REPO/$1" --paginate > "$RUNNER_TEMP/$2" 2>/dev/null || echo 'null' > "$RUNNER_TEMP/$2"; }
          fetch() {
            get "pulls/$NUMBER/reviews"   reviews.json
            get "pulls/$NUMBER/comments"  rcomments.json
            get "issues/$NUMBER/comments" icomments.json
            pushes   # again with every look: whether the log can trail the push was not measured
          }
          judge() {
            python3 "$PR_REVIEW/attest.py" "$HEAD_SHA" "$LOGINS" \
              "$RUNNER_TEMP/reviews.json" "$RUNNER_TEMP/rcomments.json" "$RUNNER_TEMP/icomments.json" "$RUNNER_TEMP/activity.json"
          }

          fetch
          if judge; then exit 0; fi

          # Whether to post the summons at all, and as whom. A mention posted by
          # `github-actions[bot]` is not honoured (measured 2026-09-18, #186:
          # two drew nothing in the full wait, a person's identical comment
          # started a review in sixteen seconds), so the summons goes out only
          # with `summons-token`, as that person, once the token's login has
          # been read and is the repository owner's: scripts/pr-review/summon.sh.
          # Who the summons would be posted as: read once, with the token.
          echo 'null' > "$RUNNER_TEMP/login.json"; : > "$RUNNER_TEMP/login.err"
          if [ -n "${SUMMONS_TOKEN:-}" ]; then
            GH_TOKEN="$SUMMONS_TOKEN" gh api user > "$RUNNER_TEMP/login.json" 2> "$RUNNER_TEMP/login.err" || echo 'null' > "$RUNNER_TEMP/login.json"
          fi
          if ! post="$(LOGIN_JSON="$RUNNER_TEMP/login.json" bash "$PR_REVIEW/summon.sh")"; then
            # gh's own words tell a bad token (HTTP 401) from a call that did
            # not get through (rate limit, 5xx); the second is fixed by a re-run.
            echo "::error::summons-token is set but cannot be used (the reason is above); nothing was posted and the wait is skipped. gh said: $(tr '\n' ' ' < "$RUNNER_TEMP/login.err" | cut -c1-300)"
            exit 1
          fi
          if [ "$post" = "post" ]; then
            echo "summons-token reads as $OWNER: nothing is posted now; at $(( WAIT / 3 ))s and $(( 2 * WAIT / 3 ))s the summons goes out, the first unless an accepted reviewer has been active since the push, the second unless one has been active since the first, neither when the activity log confirms a newer push than this head"
          else
            echo "$post"
          fi

          # When to ask (#206). The reviewer's own trigger has not started three
          # times on this repository (2026-09-18) while a person's request drew
          # a review in about two minutes. When it works it shows within
          # seconds (#195), so nothing is posted at the start: a third of the
          # way into the wait the summons goes out only if no accepted reviewer
          # has started, and at two thirds once more only if none has been
          # active since the first ask point, asked or not (a request that
          # draws nothing works minutes later, openai/codex#33048). Neither goes
          # out when the branch's activity log confirms that another commit was
          # pushed after this head (#215). The test is scripts/pr-review/started.py.

          # With a token: it stops at two summonses per commit, counted through
          # a marker hidden in each, so a loop cannot paper the pull request; a
          # failed comments call counts as none, and a run then asks as if none
          # had been posted (asking once too often is folded, #205). The
          # second try dates from 2026-09-01, when a summons drew nothing and
          # "already asked" then blocked every later attempt; that summons was
          # a bot's, which today reads as the case above (#185).
          marker="<!-- third-party-review: $HEAD_SHA -->"
          asked() {
            gh api "repos/$REPO/issues/$NUMBER/comments" --paginate --jq '.[].body' 2>/dev/null \
              | grep -cF "$marker" || true
          }
          ask() {  # [first ask point]: ask, unless an accepted reviewer has been active since the push, or since the first ask point when given
            [ "$post" = "post" ] || return 0
            if why="$(python3 "$PR_REVIEW/started.py" "$HEAD_SHA" "$LOGINS" \
                        "$RUNNER_TEMP/icomments.json" "$RUNNER_TEMP/activity.json" "${1:-}")"; then
              echo "$why: not asking"
              return 0
            fi
            n="$(asked)"
            if [ "${n:-0}" -ge 2 ]; then
              echo "$why; asked twice already for this commit: not asking again."
              return 0
            fi
            printf '%s\n\n%s\n' "$ASK" "$marker" > "$RUNNER_TEMP/ask.md"
            if GH_TOKEN="$SUMMONS_TOKEN" gh pr comment "$NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/ask.md"; then
              echo "$why: asking ($(( ${n:-0} + 1 ))/2) as $OWNER: $ASK"
            else
              # A token that reads its login but cannot comment here (no access
              # to this repository, or read-only on pull requests) is found out
              # only now; fail here, not after the wait.
              echo "::error::summons-token could not post the summons (the token reads as $OWNER but cannot comment on this pull request); the token needs Pull requests: Read and write on this repository (#205). Fix the secret and re-run."
              exit 1
            fi
          }
          start=$(date +%s)
          deadline=$(( start + WAIT ))
          first_at=""; second=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            # Sleep no further than the next ask point, so a wait shorter than
            # three looks still asks at a third and two thirds of it.
            next=$deadline
            if [ -z "$first_at" ]; then next=$(( start + WAIT / 3 ));
            elif [ "$second" -eq 0 ]; then next=$(( start + 2 * WAIT / 3 )); fi
            nap=$(( next - $(date +%s) ))
            if [ "$nap" -gt "$POLL" ]; then nap=$POLL; fi
            if [ "$nap" -lt 0 ]; then nap=0; fi
            sleep "$nap"
            now=$(date +%s); at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            fetch
            if judge; then exit 0; fi
            # The two ask points (see above), each once per run.
            if [ -z "$first_at" ] && [ "$now" -ge $(( start + WAIT / 3 )) ]; then
              first_at="$at"
              ask
            elif [ -n "$first_at" ] && [ "$second" -eq 0 ] && [ "$now" -ge $(( start + 2 * WAIT / 3 )) ]; then
              second=1
              ask "$first_at"
            fi
            echo "   ... $(( deadline - $(date +%s) ))s left"
          done

          echo "::error::no third-party review is attached to this commit ($HEAD_SHA)."
          echo "  - is the reviewer's automatic review on for this repository? https://chatgpt.com/codex/settings/code-review"
          echo "  - comment '$ASK' on the pull request yourself and re-run this job: a person's comment"
          echo "    starts the review, this job's does not unless the caller gives summons-token."
          echo "    What summons-token does and what it costs: https://github.com/coolbress/plinth/blob/main/docs/how-to/configure-the-third-party-reviewer.md#summoning-the-reviewer"
          echo "  - if an author listed above is the reviewer under another name,"
          echo "    set reviewer-logins in the caller to that name."
          exit 1
