name: pr-review
#
# Did a third party look at this commit? Reusable workflow; the check is
# `third-party / review` in every repository that calls it like this:
#
#   on:
#     pull_request:        { types: [opened, synchronize, reopened, ready_for_review] }
#     pull_request_review: { types: [submitted] }
#   permissions: { contents: read, pull-requests: read }
#   jobs:
#     third-party:
#       uses: coolbress/plinth/.github/workflows/pr-review.yml@<commit-sha>
#
# This is an optional check. `ruleset.json` does not require it; a repository
# that wants it as part of its wall adds the name with
# `scripts/upgrade-ruleset.sh <owner/name> 'third-party / review:15368'`
# (see docs/how-to/configure-the-third-party-reviewer.md). Keep the job name
# `third-party`: the check name is what rulesets require.
#
# What it checks, exactly:
#   yes  an accepted reviewer account (`reviewer-logins`) left a review signal
#        tied to THIS commit: a review, a review comment made on it, a
#        completion comment naming it, or a `Completed` row for it in the
#        reviewer's summary table. The comment and the row name the commit by
#        its first characters (ten, seven), so each counts only when it is
#        newer than the push of this commit and no other commit the branch has
#        pointed at begins with those characters (#191, #193). A fork's head
#        is pushed to the fork, not here, and was absent from this log on the
#        two fork pull requests measured (#193); there neither counts, and
#        the pull request passes on a review, a review comment or the marker.
#        Evidence of participation. A signal on an older commit does not
#        count.
#   yes  a change to the designated rules section is not mixed with other
#        changes in the same pull request.
# What it does not check:
#   no   that the whole change was reviewed, or requirements and security both.
#   no   the review's verdict. It never blocks on findings: model reviews can be
#        noisy (MSR '26 measured a signal ratio under 60% for twelve of thirteen
#        agents on closed pull requests), so an unverified verdict is not a
#        merge condition. Findings are still handled: reproduce, then fix or
#        say why not (docs/how-to/configure-the-third-party-reviewer.md).
#   no   a review on a draft or on a pull request Dependabot opened and only
#        Dependabot pushed to, nor,
#        when the caller sets `pass-release-pull-requests`, on one titled
#        `chore(release): vX.Y.Z`: on those the second step passes without a
#        summons and without looking for a review, and its log says which
#        (#167). The first step, on the instructions, still runs on them. A
#        pull request opened by any other bot, a coding agent included, is
#        looked at like a person's.
#   no   that anyone read the review. Reading is the job of the person who
#        presses merge. To make that easier the log and the job summary list
#        the accepted reviewer's inline comments on this commit, with their
#        URLs, once the check has decided (#176); a summary comment saying
#        "no major issues" has arrived next to an unanswered inline finding
#        (measured on #174).
#   no   that the reviewer is independent of the author: `reviewer-logins` is a
#        trust setting, not an independence check.
#   no   that a review gets started. The summons it can post reaches the
#        reviewer only from a person's account: measured 2026-09-18 (#186),
#        two `@codex review` comments from `github-actions[bot]` drew nothing
#        in the full wait, and the same text from a person started a review
#        sixteen seconds later; of seven reviewers read that day none
#        documents honouring a bot's mention (#185). So without the
#        `summons-token` secret nothing is posted and the wait is for the
#        reviewer's own trigger; with it, the summons is posted as that
#        person, at most twice per commit.
#   no   that the instructions cannot be weakened: only the designated section
#        is compared, and only within one pull request.
#
# Why the model does not run inside CI: it did once and stopped at the API key
# (metered billing). Now the reviewer runs in the vendor's cloud on a
# subscription, posts to the pull request, and this workflow only verifies,
# mechanically, that it did. No key, no verdict, and the narrowing lives in the
# reviewed repository's `AGENTS.md` under `## Code Review Rules`, which the
# vendor reads. Inputs are the two the caller may want to change plus the wait;
# the policy file and heading are the contract with `AGENTS.md`, not knobs.

on:
  workflow_call:
    inputs:
      reviewer-logins:
        description: |
          GitHub logins accepted as the third-party reviewer, comma separated.
          When none matches, the check fails and prints every author it did
          see, so a wrong name is fixed in one go.
        type: string
        default: "chatgpt-codex-connector[bot]"
      ask-comment:
        # Declared although no caller gives a token today, so it does nothing
        # anywhere yet: removing an input is a MAJOR change (a caller that
        # passes it fails with "Invalid input"), so it stays (#185).
        description: |
          The comment that summons the reviewer when no review is attached.
          Posted only with the `summons-token` secret, as that person; without
          the secret nothing is posted, because a bot's mention is not honoured
          (#185). Today no caller gives the secret. Empty: never summon.
        type: string
        default: "@codex review"
      wait-seconds:
        description: "How long to wait for the review; reviews are asynchronous. The security review has taken over 30 minutes."
        type: number
        default: 900
      policy-file:
        description: |
          The file the reviewer reads its instructions from. It lives inside the
          reviewed repository, so a pull request could rewrite its own reviewer;
          this workflow blocks the combination of an instruction change with any
          other change.
        type: string
        default: "AGENTS.md"
      policy-heading:
        description: "Heading of the instruction section, as the reviewer reads it."
        type: string
        default: "## Code Review Rules"
      pass-release-pull-requests:
        description: |
          Off by default. When true, a pull request titled exactly
          `chore(release): vX.Y.Z` passes without a summons and without a
          review. A title is chosen by the pull request's author, so turning
          this on lets anyone skip the review by choosing that title; do not
          turn it on where this check is required.
        type: boolean
        default: false
      poll-seconds:
        description: "Interval between looks."
        type: number
        default: 20
    secrets:
      summons-token:
        description: |
          A token of the repository owner, whose GitHub account is the one
          connected to the reviewer: the token's login is checked against
          `github.repository_owner`, so this fits a repository owned by a
          person, not by an organization (there the owner is the organization
          and no person's login matches). With it the summons is posted as
          that person and the reviewer starts; without it nothing is posted.
          A token whose login cannot be read, is another person's, or cannot
          post the comment fails the check at once with the reason, not after
          the wait.
        required: false

jobs:
  review:
    # No `if:` here: a skipped job has no check name. Drafts, Dependabot's pull
    # requests and (when the caller asks) release pull requests are handled in
    # the second step, which passes without summoning a review.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read    # the summons, when posted, goes out with summons-token, never with this token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # the base is needed for the comparison
          persist-credentials: false

      # The reviewer reads its instructions from the head of the pull request,
      # and that cannot be changed. The third-party reviewer itself raised this
      # (2026-09-01): "When a PR changes this section to say 'do not report
      # workflow bugs', Codex consumes the policy from the reviewed head, omits
      # those findings, and the check still turns green." What can be blocked
      # is the combination: a pull request that changes the instructions AND
      # anything else fails. One that changes only the instructions passes;
      # it carries nothing to smuggle in.
      - name: The reviewer's instructions did not change in this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_STATE: ${{ github.event.pull_request.state }}
          POLICY_FILE: AGENTS.md              # where the reviewer reads its instructions
          POLICY_HEADING: "## Code Review Rules"
        run: |
          set -euo pipefail

          # Nothing to guard on a merged or closed pull request. Measured
          # 2026-09-01: a review submitted after the merge re-ran this workflow,
          # base and head were gone, and git exited 128. The check exists to
          # block merges; it has no reason to turn red after one.
          if [ "${MERGED:-false}" = "true" ] || [ "${PR_STATE:-open}" != "open" ]; then
            echo "pull request already merged or closed: nothing to guard."
            exit 0
          fi

          # Both commits must exist. A missing one does not pass in silence.
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "::error::commit not found: $sha; cannot tell whether the instructions changed."
              echo "the checkout is shallow or the branch is gone. Re-run the job."
              exit 1
            fi
          done

          section() {  # <sha>: the instruction section at that commit, or nothing
            git show "$1:$POLICY_FILE" 2>/dev/null \
              | awk -v h="$POLICY_HEADING" '
                  $0 == h {inside=1; next}
                  inside && /^## / {inside=0}
                  inside {print}
                ' || true
          }
          before="$(section "$BASE_SHA")"
          after="$(section "$HEAD_SHA")"

          if [ "$before" = "$after" ]; then
            echo "the reviewer's instructions are unchanged."
            exit 0
          fi

          if [ -z "$before" ]; then
            # A section that did not exist before cannot be weakened: until now
            # the reviewer looked with no instructions at all.
            echo "::notice::the reviewer's instructions are new in this pull request (absent on the base). Not blocked."
            exit 0
          fi
          echo "::notice::the reviewer's instructions changed in this pull request."

          others="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- . ":(exclude)$POLICY_FILE")"
          if [ -n "$others" ]; then
            echo "::error::the reviewer's instructions ($POLICY_FILE $POLICY_HEADING) changed together with other files."
            echo "the third party reviews this pull request under the changed instructions; it could weaken its own review."
            echo "change the instructions in a pull request that changes only that file. Changed together:"
            echo "$others" | sed 's/^/  /' | head -40
            exit 1
          fi
          echo "this pull request changes only the instructions; nothing to smuggle in, so it passes."

      - name: A third-party review is attached to this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}   # a branch name is its author's text: env only
          DRAFT: ${{ github.event.pull_request.draft }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_STATE: ${{ github.event.pull_request.state }}
          # Author and title go through `env:`, never `${{ }}` inside `run:`:
          # a title is text the author of the pull request chooses.
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
          PASS_RELEASE: ${{ inputs.pass-release-pull-requests }}
          LOGINS: ${{ inputs.reviewer-logins }}
          ASK: ${{ inputs.ask-comment }}
          SUMMONS_TOKEN: ${{ secrets.summons-token }}
          OWNER: ${{ github.repository_owner }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}   # a fork's pull request gets no secrets
          WAIT: ${{ inputs.wait-seconds }}
          POLL: 20
        run: |
          set -euo pipefail

          if [ -z "${NUMBER:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "::error::not a pull request: nothing to check."
            exit 1
          fi
          # Pass without summoning, or go on? The decision is a script of its
          # own so tests/pr-review-gate.sh can lift it out of this file and run
          # it; it prints the reason when the check passes here and nothing when
          # the reviewer is to be looked for.
          cat > "$RUNNER_TEMP/gate.sh" <<'SH'
          set -euo pipefail
          # Drafts are never summoned; a ready head must show its own evidence,
          # and summonses per commit are limited (two, below). This check asks
          # "was this commit reviewed", so it used to re-run on every push: 29
          # runs on one pull request, 76 in a day, new heads queueing behind old
          # 900-second waits. Fix locally while draft, verify here once ready.
          # GitHub blocks merging a draft anyway.
          if [ "${DRAFT:-false}" = "true" ]; then
            echo "draft pull request: not reviewed until it is marked ready for review."
            exit 0
          fi
          if [ "${MERGED:-false}" = "true" ] || [ "${PR_STATE:-open}" != "open" ]; then
            echo "pull request already merged or closed: not waiting."
            exit 0
          fi
          # Dependabot's pull requests (#167), by name and nothing wider. The
          # first version passed every author of type `Bot`; coding agents are
          # `Bot` too (`cursor[bot]`, `claude[bot]`, `devin-ai-integration[bot]`)
          # and their pull requests are code, the ones a review is for. The three
          # spellings GitHub uses for the one account: `dependabot[bot]` in the
          # payload (measured on plinth#178), `app/dependabot` in gh, and
          # `dependabot` as an actor. To have one reviewed, comment the summons
          # on it yourself.
          #
          # The author of a pull request does not change when someone else
          # pushes to its branch (measured on plinth-template#17: author
          # `dependabot[bot]`, second commit a person's), and a commit's author
          # is whatever its writer typed: a commit signed by anyone, with
          # Dependabot's address as the author, reads `author.login:
          # dependabot[bot]`, `verified: true`. What cannot be typed is who
          # pushed. The repository's activity log names the authenticated
          # account behind every push to the branch, so: every push to this
          # branch is Dependabot's, and the newest one is this head. A log that
          # is missing, unreadable, empty, a full page (more may follow) or not
          # yet at this head counts as "not only Dependabot".
          login="$(printf '%s' "${AUTHOR_LOGIN:-}" | tr '[:upper:]' '[:lower:]')"
          case "$login" in
            'dependabot[bot]'|app/dependabot|dependabot)
              if python3 - "${ACTIVITY_JSON:-}" "${HEAD_SHA:-}" <<'PYGATE'
          import json, sys
          try:
              pushes = json.load(open(sys.argv[1]))
              head = sys.argv[2]
              ok = (isinstance(pushes, list) and 0 < len(pushes) < 100 and len(head) == 40
                    and pushes[0].get("after") == head          # newest first
                    and all((p.get("actor") or {}).get("login") == "dependabot[bot]" for p in pushes))
          except Exception:
              ok = False
          sys.exit(0 if ok else 1)
          PYGATE
              then
                echo "Dependabot pull request: not summoned"
                exit 0
              fi
              echo "Dependabot pull request, but not every push to its branch is Dependabot's: looked at like any other" >&2 ;;
          esac
          # A release pull request, only where the caller turned it on: the
          # title scripts/make-release.sh writes, whole, with the only tag shape
          # it accepts. A title is chosen by the author, so this is off unless
          # asked for (`pass-release-pull-requests`).
          if [ "${PASS_RELEASE:-false}" = "true" ] \
             && printf '%s' "${TITLE:-}" | grep -Eq '^chore\(release\): v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release pull request: not summoned"
            exit 0
          fi
          SH
          # Who pushed to the head branch, and when: for the gate, and for the
          # judgement's completion-comment and summary-row signals (#191,
          # #193). Newest first is asked for by name: the gate reads the first
          # entry as the newest push (`asc` returns oldest first, measured
          # 2026-09-18; #197). A failed call leaves a file the gate cannot
          # read as a list, which it takes as "go on and look". The count is
          # printed so a run shows whether the call works.
          pushes() {
            gh api --method GET "repos/$REPO/activity" -f ref="refs/heads/$HEAD_REF" -f direction=desc -F per_page=100 \
              > "$RUNNER_TEMP/activity.json" 2>/dev/null || echo 'null' > "$RUNNER_TEMP/activity.json"
          }
          pushes
          echo "pushes read for the head branch: $(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(len(d) if isinstance(d,list) else "none")' "$RUNNER_TEMP/activity.json" 2>/dev/null || echo none)"
          why="$(ACTIVITY_JSON="$RUNNER_TEMP/activity.json" bash "$RUNNER_TEMP/gate.sh")"
          if [ -n "$why" ]; then
            echo "$why"
            exit 0
          fi
          echo "pull request #$NUMBER, head $HEAD_SHA"
          echo "accepted reviewers: $LOGINS"

          # The judgement is a pure function, so tests/pr-review-attest.sh can
          # lift it out of this file and run it against fixtures. Inside the
          # workflow alone, the first run would be the test, with a red pull
          # request as the result.
          cat > "$RUNNER_TEMP/attest.py" <<'PY'
          r"""Did an accepted reviewer account leave a signal on THIS commit?
          Participation evidence, no verdict.

          Four signals, all accepted; the first to arrive wins (1 to 3 measured
          2026-09-01, 4 on 2026-09-18):

            1 review object: a code review ends as a review with state
              COMMENTED, even with zero findings. Fast, about four minutes.
            2 marker: `<!-- codex-security-review:v1 {"headSha":..,"status":"completed"} -->`
              inside the summary issue comment. `completed` needs the security
              review to finish too, which has taken over 30 minutes, and has
              stayed at `running` after the review was done. Not trusted alone.
            3 completion comment: with zero findings no review object may
              appear at all, only a plain issue comment ("Codex Review: Didn't
              find any major issues", "Security review completed..."). It names
              the commit (`**Reviewed commit:** \`db8c8772fd\``), ten
              characters, and it stays on the pull request: a later head made
              to share them would pass on it before any review of that head
              (#193). So it is bound as signal 4 is, by the same predicate:
              its `created_at` must be later than the newest push of this
              head, and the head must be the one commit the branch has
              pointed at that begins with the characters it names. Two
              earlier versions bound by time in place of the commit and both
              were guesses; this is a time next to the commit. String
              matching is brittle; that is why all the signals are read.
            4 summary table row: a zero-finding review started by a push
              (`New commits`) has left none of the above (measured on
              plinth#190, head fd4bb91; #191). What it did leave is a row in
              the summary issue comment, edited in place:
              `| 📝 **Code Review** | ✅ **Completed** <time> | \`fd4bb91\` | New commits |`.
              A `**Completed**` row whose commit, seven characters as the
              vendor writes it, is a prefix of the head counts. Any other
              status does not; the trigger column is not read. Seven
              characters do not name one commit: a head made to share them
              with an earlier, reviewed head would ride on that head's row
              (the reviewer's finding on plinth#192). So the row's completion
              time must also be later than the newest push that brought this
              head to the branch, read from the repository's activity log.
              Both times are written by a server, the vendor's and GitHub's;
              a commit's own dates are its author's text and are not read.
              The newest push of the head is the latest timestamp among the
              log's entries whose `after` is the head, in whatever order they
              arrive; if one of those has no readable timestamp, the push
              counts as unread (#197).
              This is a time next to the commit, not in place of it. The
              time says the row was completed after this head arrived, not
              which commit was completed: the review of an earlier head with
              the same seven characters, still running when this head is
              pushed, completes after the push (the reviewer's second finding
              there). The log holds every commit the branch has pointed at,
              the `before` and `after` of each push, force pushes included;
              the row counts only when the head is the one commit among them
              that begins with the row's characters. Where the push cannot be
              read (the call failed, the head is not in the log, a fork's
              branch) or the log is a full page of 100, which may have more
              behind it, neither the row nor the completion comment counts
              and the log says so; signals 1 and 2 compare forty characters
              and do not read the log. A fork's pull request therefore passes
              on signal 1 or 2 only (the owner's decision on #193: the fork
              is where the person who can push a colliding head is least
              known).

          Author alone cannot tell a code review from a security review; the
          same bot posts both. So the sentence guaranteed is exactly "the
          reviewer looked at this commit". The security review is not
          available on every plan and this check stands without it; the
          deterministic security checks (CodeQL, zizmor, bandit, secrets,
          dependencies) already block in CI.
          """
          import json, os, re, sys, pathlib

          head, logins_csv = sys.argv[1:3]
          reviews_p, rcomments_p, icomments_p = sys.argv[3:6]
          activity_p = sys.argv[6] if len(sys.argv) > 6 else ""   # pushes to the head branch, newest first

          #: The commit a completion comment names, seven to forty characters.
          REVIEWED = re.compile(r"Reviewed commit:\*{0,2}\s*`([0-9a-f]{7,40})`", re.I)

          #: Completion wording with zero findings. Vendor text: brittle by nature.
          DONE = re.compile(
              # No apostrophe: the vendor writes "Didn't" and the character varies.
              r"find any major issues|Security review completed"
              r"|No security issues were found|리뷰를 마쳤",   # the same completion in Korean, measured
              re.I,
          )
          logins = {x.strip().lower() for x in logins_csv.split(",") if x.strip()}
          MARK = re.compile(r"<!--\s*codex-security-review:v1\s*(\{.*?\})\s*-->", re.S)

          #: The summary comment starts with this line; a table anywhere else is not read.
          SUMMARY = "<!-- codex-pull-request-review-summary -->"
          #: One row of its table: status (bold, after one emoji), the rest of
          #: that cell, and the commit. Vendor text.
          ROW = re.compile(r"^\|[^|\n]*\|\s*(?:\S+\s+)?\*\*([^*|\n]+)\*\*([^|\n]*)\|\s*`([0-9a-f]{7,40})`\s*\|", re.M)
          #: When the row's review completed, to the second, UTC only.
          WHEN = re.compile(r'datetime="(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)(?:\.\d+)?Z"')
          #: GitHub's push time, the same shape without a fraction.
          STAMP = re.compile(r"^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ$")

          def readable(p):
              """Is the file a JSON list? The step writes `null` when a call
              fails, so a failed fetch and an empty list are told apart (#188)."""
              try:
                  return isinstance(json.loads(pathlib.Path(p).read_text() or "[]"), list)
              except (OSError, json.JSONDecodeError):
                  return False

          def load(p):
              try:
                  d = json.loads(pathlib.Path(p).read_text() or "[]")
              except (OSError, json.JSONDecodeError):
                  return []
              return d if isinstance(d, list) else []

          def ours(it):
              return ((it.get("user") or {}).get("login") or "").lower() in logins

          seen = set()
          for path in (reviews_p, rcomments_p, icomments_p):
              for it in load(path):
                  seen.add(((it.get("user") or {}).get("login") or ""))

          def looked(how, excerpt=None):
              """The verdict is yes. Say so, then list the accepted reviewer's
              inline comments made on this commit (`original_commit_id`, the
              field that does not move) with their URLs, in the log and in the
              job summary. Zero is printed as zero. The count never changes the
              verdict; it is there so the person who merges sees what the
              summary comment does not say (#176: a P2 merged past unread while
              the summary read "Didn't find any major issues"). It is what the
              fetch that produced the signal saw: a review that finishes later
              (the security review has taken over 30 minutes) adds comments
              this line does not show, so it says so."""
              print(f"third party looked at this commit: {how}")
              if excerpt:
                  print(f"   {excerpt}")
              urls = [it.get("html_url") or "(no url)" for it in load(rcomments_p)
                      if ours(it) and it.get("original_commit_id") == head]
              n = len(urls)
              if not readable(rcomments_p):
                  # A failed or malformed fetch is not zero comments (#188): say
                  # so, never the zero line. The verdict above was not built on
                  # this file, so it stands.
                  line = ("inline comments: could not be read (the pulls/<n>/comments call failed"
                          " or did not return a list); run the live query in the how-to")
              else:
                  line = (f"reviewer left {n} inline comment{'s' if n != 1 else ''} on {head[:8]}"
                          if n else f"no inline comments on this head ({head[:8]})")
                  line += " as of this check run; a later review may add more"
              print(line)
              for u in urls:
                  print(f"   {u}")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a") as f:
                      f.write(line + "\n" + "".join(f"- {u}\n" for u in urls))
              sys.exit(0)

          # 1 review objects and review comments: the commit must match.
          #
          # Two different fields, and mixing them opens the check (measured
          # 2026-09-01): the `commit_id` of a review comment (`pulls/N/comments`)
          # is rewritten by GitHub to the current head whenever a new commit
          # lands, as long as the line is still alive. One comment from an old
          # review turned every later push green within 20 seconds, 140 seconds
          # before the real review arrived. `original_commit_id` is the commit
          # the comment was made on and never moves; that is the one read.
          # Review objects (`pulls/N/reviews`) have no such field and their
          # `commit_id` does not move.
          for kind, path, field in (("review", reviews_p, "commit_id"),
                                    ("review-comment", rcomments_p, "original_commit_id")):
              for it in load(path):
                  if ours(it) and it.get(field) == head:
                      looked(f"{kind} ({it.get('state') or 'comment'})")

          # 2 marker: `completed` only. `running` is looking, not looked.
          states = []
          for it in load(icomments_p):
              if not ours(it):
                  continue
              for raw in MARK.findall(it.get("body") or ""):
                  try:
                      d = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  states.append((d.get("headSha") or "", d.get("status") or "?"))
                  if d.get("headSha") == head and d.get("status") == "completed":
                      looked("marker status=completed")

          # Signals 3 and 4 name the head by a prefix (ten characters, seven), so
          # both are also bound to the push of this head and to the head being
          # the one such commit (#191, #193). All times are UTC to the second in
          # one shape, so they compare as text.
          pushes = [p for p in load(activity_p) if isinstance(p, dict)]
          if len(pushes) >= 100:   # a full page: older pushes may be missing
              pushes = []
          # The newest push of this head is the latest by time, not the first
          # listed: the step asks for newest first, and this does not lean on
          # it (#197). One of them without a readable time: nothing is known.
          stamps = [str(p.get("timestamp") or "") for p in pushes if p.get("after") == head]
          pushed = max(stamps)[:19] if stamps and all(STAMP.match(t) for t in stamps) else ""
          tips = {str(p.get(k) or "") for p in pushes for k in ("before", "after")}

          def unbound(sha, when):
              """Why a signal that names this head as `sha` and was finished at
              `when` is not tied to it; empty when it is."""
              if not pushed:
                  return "the push of this head could not be read, or the log is a full page"
              if not when > pushed:
                  return f"finished {when or '(no time read)'}, not after the push of this head ({pushed}Z)"
              if [t for t in tips if t.startswith(sha)] != [head]:
                  return f"another commit this branch has pointed at begins with {sha}"
              return ""

          # 3 completion comment: names a prefix of the head, created after the
          # newest push of this head (`created_at`, GitHub's).
          left_out = []
          for it in load(icomments_p):
              body = it.get("body") or ""
              if not ours(it) or not DONE.search(body):
                  continue
              m = REVIEWED.search(body)
              if not m:
                  # A completion that names no commit belongs to an unknown commit.
                  continue
              sha = m.group(1)
              if head.startswith(sha):
                  when = str(it.get("created_at") or "")
                  when = when[:19] if STAMP.match(when) else ""
                  why = unbound(sha, when)
                  if not why:
                      looked(f"completion comment (Reviewed commit: {sha}, {when}Z; this head was pushed {pushed}Z)",
                             body.splitlines()[0][:90])
                  left_out.append((sha, why))

          # 4 summary table row: `Completed`, the commit is a prefix of the head,
          # and the completion is later than the newest push of this head.
          rows = []
          for it in load(icomments_p):
              body = it.get("body") or ""
              if not ours(it) or not body.lstrip().startswith(SUMMARY):
                  continue
              for status, cell, sha in ROW.findall(body):
                  when = WHEN.search(cell)
                  when = when.group(1) if when else ""
                  fits = status == "Completed" and head.startswith(sha)
                  why = unbound(sha, when) if fits else ""
                  if fits and not why:
                      looked(f"summary table row (Completed, {sha}, {when}Z; this head was pushed {pushed}Z)")
                  note = "<- this commit" if head.startswith(sha) else ""
                  if why:
                      note += f", not counted: {why}"
                  rows.append((sha, status, note))

          print("not yet.")
          for sha, status in states[-3:]:
              print(f"   marker {sha[:8]} status={status} {'<- this commit' if sha == head else ''}")
          for sha, why in left_out[-3:]:
              print(f"   completion comment {sha} <- this commit, not counted: {why}")
          for sha, status, note in rows[-3:]:
              print(f"   summary row {sha[:8]} status={status} {note}")
          if seen:
              print("  authors seen on this pull request: " + ", ".join(sorted(x for x in seen if x)))
          sys.exit(1)
          PY

          # The signals live in three APIs; one alone misses (see the docstring).
          # A failed call leaves `null`, not `[]`: the verdict reads either as
          # "no signal", and the inline-comment report tells them apart (#188).
          get() { gh api "repos/$REPO/$1" --paginate > "$RUNNER_TEMP/$2" 2>/dev/null || echo 'null' > "$RUNNER_TEMP/$2"; }
          fetch() {
            get "pulls/$NUMBER/reviews"   reviews.json
            get "pulls/$NUMBER/comments"  rcomments.json
            get "issues/$NUMBER/comments" icomments.json
            pushes   # again with every look: whether the log can trail the push was not measured
          }
          judge() {
            python3 "$RUNNER_TEMP/attest.py" "$HEAD_SHA" "$LOGINS" \
              "$RUNNER_TEMP/reviews.json" "$RUNNER_TEMP/rcomments.json" "$RUNNER_TEMP/icomments.json" "$RUNNER_TEMP/activity.json"
          }

          fetch
          if judge; then exit 0; fi

          # Whether to post the summons at all, and as whom. A mention posted by
          # `github-actions[bot]` is not honoured (measured 2026-09-18, #186:
          # two drew nothing in the full wait, a person's identical comment
          # started a review in sixteen seconds), so the summons goes out only
          # with `summons-token`, as that person, once the token's login has
          # been read and is the repository owner's. The decision is a script
          # of its own so tests/pr-review-summon.sh can lift it out and run
          # it: it prints `post` when the summons is to be posted, prints why
          # not otherwise, and exits 1 when a token is set but cannot be used,
          # so a broken token fails here and not after the wait.
          cat > "$RUNNER_TEMP/summon.sh" <<'SUMMON'
          set -euo pipefail
          if [ -z "${SUMMONS_TOKEN:-}" ]; then
            if [ "${FORK:-false}" = "true" ]; then
              # GitHub withholds secrets from a pull request opened from a fork,
              # so a configured token is empty here; say so, or the caller reads
              # it as "not configured".
              echo "no summons-token (a fork's pull request gets no secrets): nothing is posted; waiting for the reviewer's own trigger, or for a person to comment the summons"
            else
              echo "no summons-token: nothing is posted; waiting for the reviewer's own trigger"
            fi
            exit 0
          fi
          if [ -z "${ASK:-}" ]; then
            echo "ask-comment is empty: nothing is posted"
            exit 0
          fi
          login="$(python3 - "${LOGIN_JSON:-/dev/null}" <<'PYLOGIN'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
              print((d.get("login") or "") if isinstance(d, dict) else "")
          except Exception:
              print("")
          PYLOGIN
          )"
          if [ -z "$login" ]; then
            echo "::error::summons-token is set but no login could be read with it; fix or remove the secret." >&2
            exit 1
          fi
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if [ "$(lower "$login")" != "$(lower "${OWNER:-}")" ]; then
            echo "::error::summons-token belongs to '$login', not to the repository owner '${OWNER:-}'; the summons is posted only as the owner." >&2
            exit 1
          fi
          echo "post"
          SUMMON
          # Who the summons would be posted as: read once, with the token.
          echo 'null' > "$RUNNER_TEMP/login.json"; : > "$RUNNER_TEMP/login.err"
          if [ -n "${SUMMONS_TOKEN:-}" ]; then
            GH_TOKEN="$SUMMONS_TOKEN" gh api user > "$RUNNER_TEMP/login.json" 2> "$RUNNER_TEMP/login.err" || echo 'null' > "$RUNNER_TEMP/login.json"
          fi
          if ! post="$(LOGIN_JSON="$RUNNER_TEMP/login.json" bash "$RUNNER_TEMP/summon.sh")"; then
            # gh's own words tell a bad token (HTTP 401) from a call that did
            # not get through (rate limit, 5xx); the second is fixed by a re-run.
            echo "::error::summons-token is set but cannot be used (the reason is above); nothing was posted and the wait is skipped. gh said: $(tr '\n' ' ' < "$RUNNER_TEMP/login.err" | cut -c1-300)"
            exit 1
          fi
          echo "$post"

          # With a token: at most twice per commit, counted through a marker
          # hidden in the comment, so a loop cannot paper the pull request. The
          # second try dates from 2026-09-01, when a summons drew nothing and
          # "already asked" then blocked every later attempt; that summons was
          # a bot's, which today reads as the case above (#185).
          marker="<!-- third-party-review: $HEAD_SHA -->"
          asked() {
            gh api "repos/$REPO/issues/$NUMBER/comments" --paginate --jq '.[].body' 2>/dev/null \
              | grep -cF "$marker" || true
          }
          ask() {
            [ "$post" = "post" ] || return 0
            n="$(asked)"
            if [ "${n:-0}" -ge 2 ]; then
              echo "asked twice already; not asking again."
              return 0
            fi
            printf '%s\n\n%s\n' "$ASK" "$marker" > "$RUNNER_TEMP/ask.md"
            if GH_TOKEN="$SUMMONS_TOKEN" gh pr comment "$NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/ask.md"; then
              echo "asked ($(( ${n:-0} + 1 ))/2) as $OWNER: $ASK"
            else
              # A token that reads its login but cannot comment here (no access
              # to this repository, or read-only on pull requests) is found out
              # only now; fail here, not after the wait.
              echo "::error::summons-token could not post the summons (the token reads as $OWNER but cannot comment on this pull request); fix the secret's access and re-run."
              exit 1
            fi
          }
          ask

          deadline=$(( $(date +%s) + WAIT ))
          halfway=$(( $(date +%s) + WAIT / 2 ))
          retried=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep "$POLL"
            fetch
            if judge; then exit 0; fi
            # Halfway through with nothing attached: ask once more (see above).
            if [ "$retried" -eq 0 ] && [ "$(date +%s)" -ge "$halfway" ]; then
              retried=1
              ask
            fi
            echo "   ... $(( deadline - $(date +%s) ))s left"
          done

          echo "::error::no third-party review is attached to this commit ($HEAD_SHA)."
          echo "  - is the reviewer's automatic review on for this repository? https://chatgpt.com/codex/settings/code-review"
          echo "  - comment '$ASK' on the pull request yourself and re-run this job: a person's comment"
          echo "    starts the review, this job's does not unless the caller gives summons-token."
          echo "  - if an author listed above is the reviewer under another name,"
          echo "    set reviewer-logins in the caller to that name."
          exit 1
