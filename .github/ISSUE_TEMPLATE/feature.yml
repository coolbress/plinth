name: Feature request
description: Something that does not work today and you want it to.
labels: ["enhancement"]
# Field order follows the census: proposed-solution · alternatives-considered · additional-context.
# This form collects the idea. Acceptance criteria are written later, in the ticket.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you blocked on
      description: |
        Describe the **problem**, not the solution. How did you handle it the
        last time, and what did that cost? That is the case for doing this.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: How you would like it to work
      description: |
        If you have a way in mind. Optional — the field above matters more.
        What would you be able to do that you cannot today? That sentence is
        what the acceptance criteria get written from.
    validations:
      required: false

  - type: textarea
    id: what-should-happen
    attributes:
      label: What should happen
      description: |
        One line for each thing a person can try, written as "When I …, then
        I see …". Each line becomes a test, so keep each one small.
      placeholder: |
        When I save a note with no title, then I see "Add a title first" and the note is not saved.
    validations:
      required: false

  - type: textarea
    id: not-sure-yet
    attributes:
      label: Not sure yet
      description: |
        Anything you have not decided. Write it here instead of guessing: it is
        asked about before any code is written.
      placeholder: |
        Should a note with no title be kept as a draft, or not saved at all?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: |
        **Include things that already exist.** Why the existing option is not enough
        is the case for this request.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Decisions taken while this is open go in the body, dated, and so does
        the outcome when it closes — completed, cancelled, superseded, or moved
        to a follow-up are four different endings. The body is the record;
        comments are conversation.
