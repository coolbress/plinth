name: Bug
description: Something behaves differently from what you expected.
labels: ["bug"]
# Field order follows the census of the 2,000 most-starred software repositories:
# additional-context · steps-to-reproduce · expected-behavior · description · version/OS · logs.
# `required` is set on textareas only — that is the norm in the wild.
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: |
        What you observed, and what it stops you doing. Put guesses about the
        cause under *Anything else*.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Doing this, in this order, makes it happen again.
      placeholder: |
        1. `uv run …`
        2. …
        3. it fails here
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: "**The gap between observed and expected is the definition of the bug.**"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version · environment
      placeholder: "e.g. v0.1.0 · macOS 15 · Python 3.12"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs · traceback
      description: Paste if you have them. This field is rendered as a code block.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: |
        The most common field in the census — if we don't ask, it doesn't get
        written. How often it happens and whether there is a way around it
        belong here: that is what decides whether this gets picked up.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Decisions taken while this is open go in the body, dated, and so does
        the outcome when it closes. The body is the record; comments are
        conversation.
