name: Task
description: One thing to build. The acceptance criteria are what a check or a reviewer can confirm.
labels: ["task"]
# The shape the planning flow produces (a spec cut into tickets): parent, what,
# acceptance criteria, what stays out, what blocks it. Decisions made while the
# task is open go into the body under "## Decisions", dated; the outcome under
# "## Outcome". The body is the record; comments are conversation.
body:
  - type: input
    id: parent
    attributes:
      label: Parent
      description: 'The spec or map this comes from, as `#N`; a ticket cut from a spec adds its id and original title, such as `#12 T6.16 ci(release): trusted publishing`. Leave empty for a standalone task.'
    validations:
      required: false

  - type: textarea
    id: what
    attributes:
      label: What to build
      description: |
        One paragraph, present tense, what exists when this is done — and, if it
        is not obvious from the parent, why it is worth doing.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: |
        Done means: one line each, as a checklist. Each line is something a
        check, a test or a reviewer can confirm — a filled-in section is not one
        of those. When this closes, tick each one that was met; one left open
        is named under `## Outcome` with why.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: what-should-happen
    attributes:
      label: What should happen
      description: |
        One line for each thing a person can try, written as "When I …, then
        I see …". Each line becomes a test, so keep each one small.
      placeholder: |
        When I save a note with no title, then I see "Add a title first" and the note is not saved.
    validations:
      required: false

  - type: textarea
    id: not-sure-yet
    attributes:
      label: Not sure yet
      description: |
        Anything you have not decided. Write it here instead of guessing: it is
        asked about before any code is written.
      placeholder: |
        Should a note with no title be kept as a draft, or not saved at all?
    validations:
      required: false

  - type: textarea
    id: not-building
    attributes:
      label: Not building
      description: What this task deliberately leaves out, so nobody adds it back in review.
    validations:
      required: false

  - type: input
    id: blocked-by
    attributes:
      label: Blocked by
      description: Tasks that must close first, as `#N, #N`.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Decisions taken while this is open go in the body under `## Decisions`,
        dated, and the ending under `## Outcome`: completed, cancelled,
        superseded, or moved to a follow-up are four different endings and the
        record should say which. The body is the record; comments are
        conversation.
